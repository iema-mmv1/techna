<style>
/* TECHNA — carrossel automático e interativo de notícias */
.news-carousel-shell{position:relative;overflow:hidden;padding:4px 46px 13px;border-radius:20px;background:#321047}
.news-carousel-track{display:flex;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x mandatory;scrollbar-width:none}
.news-carousel-track::-webkit-scrollbar{display:none}
.news-carousel-slide{display:grid;grid-template-columns:minmax(230px,.9fr) minmax(260px,1.1fr);flex:0 0 100%;min-height:310px;scroll-snap-align:start;color:#fff}
.news-carousel-image{min-height:310px;background:linear-gradient(135deg,#722a80,#df92c1);background-size:cover;background-position:center}
.news-carousel-copy{display:flex;flex-direction:column;justify-content:center;padding:30px}
.news-carousel-copy small{color:#e9ddef;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.news-carousel-copy h3{margin:9px 0;font-size:clamp(1.25rem,2.5vw,2rem)}
.news-carousel-copy p{color:#f2e8f4;line-height:1.55}
.news-carousel-arrow{position:absolute;z-index:2;top:50%;display:grid;width:38px;height:38px;place-items:center;color:var(--p);border:0;border-radius:50%;background:#fff;box-shadow:0 5px 18px #16051d66;transform:translateY(-50%);font-size:1.2rem;font-weight:900}
.news-carousel-arrow:hover{background:var(--lime);transform:translateY(-50%) scale(1.08)}
.news-carousel-arrow.prev{left:10px}.news-carousel-arrow.next{right:10px}
.news-carousel-dots{display:flex;justify-content:center;gap:7px;margin-top:12px}
.news-carousel-dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:#d9c5dd;transition:.2s}
.news-carousel-dot.active{width:25px;border-radius:99px;background:var(--lime)}
.news-carousel-shell:hover .news-carousel-arrow{opacity:1}
.news-carousel-hint{margin:8px 0 0;color:#e9ddef;text-align:center;font-size:.74rem}
.dynamic-news-card{transition:transform .22s ease,box-shadow .22s ease}
.dynamic-news-card:hover{transform:translateY(-7px) scale(1.025);box-shadow:0 18px 32px #4d12632b}
@media(max-width:700px){.news-carousel-slide{grid-template-columns:1fr}.news-carousel-image{min-height:170px}.news-carousel-copy{padding:20px}.news-carousel-shell{padding-inline:40px}}
</style>

<script>
/* TECHNA — estado do carrossel */
const newsCarouselState={index:0,timer:null,paused:false,items:[],root:null};

function renderNewsCarousel(items){
  const list=(items||[]).filter(Boolean);
  newsCarouselState.items=list;
  if(!list.length)return `<div class="empty">Ainda não há notícias para exibir.</div>`;
  return `<div class="news-carousel-shell" data-news-carousel>
    <button class="news-carousel-arrow prev" type="button" data-news-carousel-prev aria-label="Notícia anterior">‹</button>
    <div class="news-carousel-track" data-news-carousel-track>
      ${list.map((n,i)=>`<article class="news-carousel-slide" data-news-slide="${i}">
        <div class="news-carousel-image" style="${n.imagem_capa_url?`background-image:url('${esc(n.imagem_capa_url)}')`:''}"></div>
        <div class="news-carousel-copy">
          <small>${esc(n.categoria||'Notícia')}</small>
          <h3>${esc(n.titulo||'Atualização da TECHNA')}</h3>
          <p>${esc(n.resumo||'Acompanhe as novidades da comunidade.')}</p>
          ${n.project_id?`<button class="btn btn-primary" type="button" data-project-news="${esc(n.project_id)}">Abrir projeto</button>`:''}
        </div>
      </article>`).join('')}
    </div>
    <button class="news-carousel-arrow next" type="button" data-news-carousel-next aria-label="Próxima notícia">›</button>
    <div class="news-carousel-dots" role="tablist">
      ${list.map((_,i)=>`<button class="news-carousel-dot${i===0?' active':''}" type="button" data-news-carousel-dot="${i}" aria-label="Ir para notícia ${i+1}"></button>`).join('')}
    </div>
    <p class="news-carousel-hint">Passe o mouse para pausar · use as setas ou arraste para navegar</p>
  </div>`;
}

function stopNewsCarousel(){
  if(newsCarouselState.timer){clearInterval(newsCarouselState.timer);newsCarouselState.timer=null}
}
function updateNewsCarousel(index,behavior='smooth'){
  const root=newsCarouselState.root;if(!root)return;
  const track=root.querySelector('[data-news-carousel-track]');
  const slides=[...root.querySelectorAll('[data-news-slide]')];
  if(!track||!slides.length)return;
  newsCarouselState.index=(index+slides.length)%slides.length;
  track.scrollTo({left:slides[newsCarouselState.index].offsetLeft,behavior});
  root.querySelectorAll('[data-news-carousel-dot]').forEach((dot,i)=>dot.classList.toggle('active',i===newsCarouselState.index));
}
function startNewsCarousel(){
  stopNewsCarousel();
  if(newsCarouselState.items.length<2)return;
  newsCarouselState.timer=setInterval(()=>{
    if(!newsCarouselState.paused)updateNewsCarousel(newsCarouselState.index+1);
  },5000);
}
function initNewsCarousel(){
  const root=document.querySelector('[data-news-carousel]');
  if(!root)return;
  newsCarouselState.root=root;
  const track=root.querySelector('[data-news-carousel-track]');
  root.querySelector('[data-news-carousel-prev]')?.addEventListener('click',()=>{updateNewsCarousel(newsCarouselState.index-1);startNewsCarousel()});
  root.querySelector('[data-news-carousel-next]')?.addEventListener('click',()=>{updateNewsCarousel(newsCarouselState.index+1);startNewsCarousel()});
  root.querySelectorAll('[data-news-carousel-dot]').forEach(dot=>dot.addEventListener('click',()=>{updateNewsCarousel(Number(dot.dataset.newsCarouselDot));startNewsCarousel()}));
  root.addEventListener('mouseenter',()=>newsCarouselState.paused=true);
  root.addEventListener('mouseleave',()=>newsCarouselState.paused=false);
  let startX=0;
  track?.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});
  track?.addEventListener('touchend',e=>{const delta=startX-e.changedTouches[0].clientX;if(Math.abs(delta)>45)updateNewsCarousel(newsCarouselState.index+(delta>0?1:-1));startNewsCarousel()},{passive:true});
  track?.addEventListener('scroll',()=>{
    const slides=[...root.querySelectorAll('[data-news-slide]')];
    if(!slides.length)return;
    const nearest=slides.reduce((best,slide,i)=>Math.abs(slide.offsetLeft-track.scrollLeft)<Math.abs(slides[best].offsetLeft-track.scrollLeft)?i:best,0);
    if(nearest!==newsCarouselState.index){newsCarouselState.index=nearest;root.querySelectorAll('[data-news-carousel-dot]').forEach((dot,i)=>dot.classList.toggle('active',i===nearest))}
  });
  startNewsCarousel();
}

  initNewsCarousel();
}
</script>
