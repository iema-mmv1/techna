ize:1.75rem}.dash-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.75fr);gap:20px}.wide{grid-column:1/-1}.carousel{overflow:hidden;color:#fff;border-radius:20px;background:#321047}.carousel-track{display:flex;overflow:auto;scroll-snap-type:x mandatory}.slide{display:grid;grid-template-columns:1fr 1fr;flex:0 0 100%;min-height:300px;scroll-snap-align:start}.slide-image{min-height:300px;background:linear-gradient(135deg,#722a80,#df92c1)}.slide-content{display:flex;flex-direction:column;justify-content:center;padding:29px}.horizontal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,330px);gap:15px;overflow-x:auto;padding:3px 2px 11px}.news-card,.project-card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer}.news-image{height:145px;background:linear-gradient(135deg,#722a80,#df92c1)}.news-body{padding:14px}.news-body h3{margin:8px 0;color:var(--p)}.news-body p,.project-body p{color:var(--muted);font-size:.82rem}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.project-cover{display:flex;align-items:flex-end;min-height:125px;padding:14px;color:#fff;background:linear-gradient(135deg,#4d1263,#df92c1)}.project-cover h3{margin:0}.project-body{padding:14px}.bar{height:8px;overflow:hidden;border-radius:99px;background:#f0ebf1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#722a80,#a8d719)}.project-foot{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:.75rem}.pill{padding:4px 8px;color:#587900;border-radius:999px;background:var(--lime2)}.empty{padding:42px 15px;color:var(--muted);text-align:center}.profile-head{display:flex;align-items:center;gap:17px;padding-bottom:21px;border-bottom:1px solid var(--line)}.avatar-xl{width:84px;height:84px}.modal-bg{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:#32104799}.modal{width:min(100%,850px);max-height:92vh;overflow:auto;padding:24px;border-radius:22px;background:#fff;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;margin-bottom:20px}.close{display:grid;width:36px;height:36px;place-items:center;border:1px solid var(--line);border-radius:10px;background:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.span-2{grid-column:1/-1}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.role{padding:13px;text-align:left;border:1px solid var(--line);border-radius:11px;background:#fff}.role.selected{border-color:#8daa00;background:var(--lime2)}.role strong,.role small{display:block}.role small{margin-top:4px;color:var(--muted)}.steps{display:grid;gap:8px;margin-top:12px}.step{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px}.step input{width:19px;height:19px;accent-color:#8daa00}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.toolbar .input,.toolbar .select{max-width:300px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.list{display:grid;gap:11px}.list-item{display:flex;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:1px solid #f0ebf1}.people{display:grid;gap:8px;max-height:220px;overflow:auto}.person{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--line);border-radius:10px}.account-google{padding:18px;border-radius:15px;background:#f7f2f8}.account-google h3{margin:0 0 7px;color:var(--p)}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:820px){.login{display:block}.login-art{min-height:390px;padding:28px}.login-panel{min-height:650px;padding:44px 24px}.layout{display:block}.sidebar{position:fixed;z-index:30;left:0;top:0;width:265px;transform:translateX(-105%);transition:.25s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.menu{display:inline-grid;margin-right:8px}.slide{grid-template-columns:1 <script>
"use strict";
const SUPABASE_URL="https://edtgebzafwkounipfvrb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_t2nSHz0OetO50wFuSGct6A_tiRt3Fu-";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true,flowType:"pkce"}});

const app=document.getElementById("app"),modalRoot=document.getElementById("modal-root"),toast=document.getElementById("toast");

function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}function showToast(text){toast.textContent=text;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),4500)}function initials(value){return String(value||"U").split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}function avatar(profile,large=false){return`<span class="avatar${large?" avatar-xl":""}">${profile?.foto_url?`<img src="${esc(profile.foto_url)}" alt="Foto de perfil">`:initials(profile?.nome||profile?.email)}</span>`}function brand(){return`<a class="brand" href="#" data-page="dashboard"><span class="brand-mark">✦</span><span class="brand-name">TECHNA</span></a>`}function authError(error){const text=String(error?.message||"").toLowerCase();if(text.includes("provider is not enabled"))return"O provedor Google não está ativado no Supabase.";if(text.includes("redirect")||text.includes("url"))return"A URL de retorno não está autorizada no Supabase.";if(text.includes("email not confirmed"))return"Confirme o e-mail antes de entrar.";if(text.includes("invalid login credentials"))return"E-mail, username ou senha incorretos.";if(text.includes("already registered"))return"Este e-mail já possui cadastro.";if(text.includes("duplicate key"))return"Esse username já está em uso.";return error?.message||"Não foi possível concluir a operação."}
function renderLogin(){app.innerHTML=`<main class="login"><section class="login-art"><canvas id="network-canvas" class="network-canvas"></canvas><div>${brand()}<p class="kicker" style="margin-top:28px">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="chips"><span>Criar</span><span>Colaborar</span><span>Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e criatividade.</small></section><section class="login-panel"><div class="auth"><p class="kicker">Acesso à plataforma</p><h2>Bem-vindo à TECHNA</h2><p class="auth-intro muted">Entre para acompanhar e compartilhar projetos.</p><form id="login-form" novalidate><div class="field"><label for="login-identifier">E-mail ou username</label><input id="login-identifier" class="input" name="identifier" autocomplete="username" required></div><div class="field"><label for="login-password">Senha</label><div class="password"><input id="login-password" class="input" name="password" type="password" autocomplete="current-password" minlength="6" required><button type="button" data-toggle-password="login-password">◉</button></div></div><button type="button" class="btn btn-ghost" data-action="forgot-password">Esqueci minha senha</button><p id="login-message" class="message" role="alert"></p><button type="submit" class="btn btn-primary full">Entrar</button></form><div class="divider">ou continue com</div><div class="social-login"><button type="button" data-oauth="google">Google</button><button type="button" data-oauth="facebook">Facebook</button></div><p class="muted" style="text-align:center;margin-top:22px">Ainda não tem uma conta? <button type="button" class="btn btn-secondary" data-action="create-account">Criar conta</button></p></div></section></main>`;initCanvas()}
function initCanvas(){const canvas=document.getElementById("network-canvas");if(!canvas)return;const ctx=canvas.getContext("2d");let width=0,height=0;function resize(){const ratio=Math.min(devicePixelRatio||1,2);width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0)}function draw(){ctx.clearRect(0,0,width,height);ctx.fillStyle="#ffffff55";for(let i=0;i<45;i++){ctx.beginPath();ctx.arc((i*97+Date.now()/35)%Math.max(width,1),(i*53)%Math.max(height,1),1.5,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}resize();window.addEventListener("resize",resize);draw()}
function dataProjects(){return state.projects.length?state.projects:demoProjects}function dataNews(){return state.news.length?state.news:demoNews}function projectCard(p){return`<article class="project-card" data-project="${esc(p.id)}"><div class="project-cover"><h3>${esc(p.titulo)}</h3></div><div class="project-body"><p>${esc(p.descricao)}</p><div class="bar"><i style="width:${Number(p.progresso||0)}%"></i></div><div class="project-foot"><span>${Number(p.progresso||0)}% concluído</span><span class="pill">${esc(p.status||"planejamento")}</span></div></div></article>`}function newsCard(n){return`<article class="news-card" data-news="${esc(n.id)}"><div class="news-image"></div><div class="news-body"><small>${esc(n.categoria||"Notícia")}</small><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo)}</p></div></article>`}
function titleData(){return{dashboard:["Olá, "+(state.profile?.nome?.split(" ")[0]||"estudante")+"!","Bem-vindo ao seu espaço de projetos."],projects:["Projetos","Crie, explore e acompanhe projetos."],news:["Notícias","Acompanhe o que está acontecendo na TECHNA."],favorites:["Favoritos","Consulte seus conteúdos salvos."],voting:["Destaque do mês","A comunidade escolhe em conjunto."],suggestions:["Sugestões","Sua ideia pode melhorar a plataforma."],profile:["Meu perfil","Gerencie suas informações e seu avatar."],teacher:["Área dos professores","Acompanhe orientações e colaborações."],admin:["Administração","Gestão e moderação da plataforma."]}[state.page]}
function frame(html){const [title,subtitle]=titleData();document.getElementById("pageTitle").textContent=title;document.getElementById("pageSubtitle").textContent=subtitle;document.getElementById("pageContent").innerHTML=html;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function dashboard(){const ps=dataProjects(),ns=dataNews();frame(`<div class="stats"><article class="stat"><small>Meus projetos</small><b>${state.projects.length}</b></article><article class="stat"><small>Em acompanhamento</small><b>0</b></article><article class="stat"><small>Convites</small><b>0</b></article><article class="stat"><small>Progresso médio</small><b>${ps.length?Math.round(ps.reduce((a,p)=>a+Number(p.progresso||0),0)/ps.length):0}%</b></article></div><div class="dash-grid"><section class="card wide"><div class="card-head"><h2>Em destaque</h2></div><div class="carousel"><div class="carousel-track">${ns.map(n=>`<div class="slide"><div class="slide-image"></div><div class="slide-content"><small>${esc(n.categoria)}</small><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo)}</p><button class="btn btn-primary" data-news="${esc(n.id)}">Abrir notícia</button></div></div>`).join("")}</div></div></section><section class="card wide"><div class="card-head"><h2>Notícias recentes</h2><button class="btn btn-ghost" data-page="news">Ver todas</button></div><div class="horizontal">${ns.map(newsCard).join("")}</div></section><section class="card"><div class="card-head"><h2>Meus projetos</h2><button class="btn btn-primary" data-action="new-project">Novo projeto</button></div><div class="project-grid">${ps.slice(0,4).map(projectCard).join("")}</div></section></div>`)}function projectsPage(){frame(`<section class="card"><div class="card-head"><h2>Projetos</h2><button class="btn btn-primary" data-action="new-project">Novo projeto</button></div><div class="project-grid">${dataProjects().map(projectCard).join("")}</div></section>`)}function newsPage(){frame(`<section class="card"><h2>Notícias</h2><div class="horizontal">${dataNews().map(newsCard).join("")}</div></section>`)}function profilePage(){const p=state.profile||{};frame(`<section class="card"><div class="profile-head">${avatar(p,true)}<div><h2>${esc(p.nome||"Usuário")}</h2><p class="muted">${esc(p.username||"usuário")} · ${esc(p.curso||"Sem curso")}</p></div></div></section>`)}function simplePage(){frame(`<section class="card"><h2>${titleData()[0]}</h2><div class="empty">Esta área está pronta para receber os dados do Supabase.</div></section>`)}function goPage(page){state.page=page;({dashboard,projects:projectsPage,news:newsPage,profile:profilePage,favorites:simplePage,voting:simplePage,suggestions:simplePage,teacher:simplePage,admin:simplePage}[page]||dashboard)()}
function renderApp(){const p=state.profile||{};app.innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar">${brand()}<nav class="nav"><button data-page="dashboard">Visão geral</button><button data-page="projects">Projetos</button><button data-page="news">Notícias</button><button data-page="favorites">Favoritos</button><button data-page="voting">Destaque do mês</button><button data-page="suggestions">Sugestões</button><button data-page="profile">Meu perfil</button><button data-page="teacher">Área dos professores</button><button data-page="admin">Administração</button></nav><div class="sidebar-bottom"><div class="mini-profile">${avatar(p)}<div><strong>${esc(p.nome||state.user?.email||"Usuário")}</strong><small>${esc(p.username||"usuário")}</small></div></div><button class="logout" data-action="logout">Sair da conta</button></div></aside><main class="main"><header class="topbar"><div><button class="icon-btn menu" data-action="toggle-menu">☰</button><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div><div class="top-actions"><button class="icon-btn" data-action="notifications">♢</button></div></header><section id="pageContent"></section></main></div>`;goPage(state.page)}
function openModal(title,body){modalRoot.innerHTML=`<div class="modal-bg" data-close-modal><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" data-close-modal>×</button></div>${body}</div></div>`}function closeModal(){modalRoot.innerHTML=""}
function registerModal(){openModal("Criar conta",`<form id="account-form" novalidate><div class="form-grid"><div class="field span-2"><label>Nome completo</label><input class="input" name="nome" autocomplete="name" required></div><div class="field span-2"><label>Username</label><input class="input" name="username" autocomplete="username" pattern="[a-z0-9_]{3,30}" required><small class="muted">Use 3 a 30 caracteres: letras minúsculas, números ou _.</small></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" autocomplete="new-password" minlength="6" required></div><div class="field span-2"><label>Tipo de conta</label><div class="role-grid"><button type="button" class="role selected" data-role="aluno"><strong>Aluno</strong><small>Cria e participa de projetos</small></button><button type="button" class="role" data-role="professor"><strong>Professor</strong><small>Orienta projetos</small></button></div><input type="hidden" name="tipo" value="aluno"></div><div class="field span-2" id="courseField"><label>Curso</label><select class="select" name="curso"><option value="">Escolha seu curso</option><option>Marketing</option><option>Administração</option><option>Informática</option><option>Informática para Internet</option></select></div></div><p id="account-message" class="message" role="alert"></p><button type="submit" class="btn btn-primary full">Criar conta</button></form>`);document.querySelectorAll("[data-role]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-role]").forEach(x=>x.classList.remove("selected"));button.classList.add("selected");document.querySelector('[name="tipo"]').value=button.dataset.role;document.getElementById("courseField").classList.toggle("hidden",button.dataset.role!=="aluno")}))}
function googleProfileModal(){openModal("Complete seu cadastro",`<div class="account-google"><h3>Quase pronto!</h3><p class="muted">Sua conta Google foi autenticada. Preencha os dados abaixo para criar o seu perfil TECHNA. Depois você continuará entrando pelo botão Google.</p></div><form id="google-profile-form" novalidate><div class="field"><label>Nome</label><input class="input" name="nome" value="${esc(state.user?.user_metadata?.full_name||state.user?.user_metadata?.name||"")}" required></div><div class="field"><label>Username</label><input class="input" name="username" pattern="[a-z0-9_]{3,30}" required><small class="muted">Esse username será usado apenas para identificar seu perfil.</small></div><div class="field"><label>Curso</label><select class="select" name="curso" required><option value="">Escolha seu curso</option><option>Marketing</option><option>Administração</option><option>Informática</option><option>Informática para Internet</option></select></div><p id="google-profile-message" class="message"></p><button class="btn btn-primary full" type="submit">Salvar perfil e entrar</button></form>`)}function openForgot(){openModal("Recuperar acesso",`<form id="forgot-form" novalidate><div class="field"><label>E-mail</label><input class="input" id="forgot-email" type="email" required></div><p id="forgot-message" class="message"></p><button class="btn btn-primary full" type="submit">Enviar instruções</button></form>`)}function projectModal(){openModal("Novo projeto",`<form id="project-form"><div class="field"><label>Título</label><input class="input" name="titulo" required></div><div class="field"><label>Descrição</label><textarea class="textarea" name="descricao" required></textarea></div><div class="field"><label>Área</label><input class="input" name="area" required></div><button class="btn btn-primary full">Criar projeto</button></form>`)}
async function resolveUsername(value){const identifier=String(value||"").trim().toLowerCase();if(identifier.includes("@"))return identifier;const result=await supabaseClient.rpc("resolve_username",{username_input:identifier});if(result.error)throw result.error;return result.data?.[0]?.email||null}
async function loadProfile(user){const result=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();if(result.error)throw result.error;state.profile=result.data||null}
async function loadData(){if(!state.user)return;const [projects,news,favorites]=await Promise.all([supabaseClient.from("projects").select("*").order("created_at",{ascending:false}),supabaseClient.from("news").select("*").eq("status","publicado").order("created_at",{ascending:false}),supabaseClient.from("favorites").select("*").eq("user_id",state.user.id)]);if(!projects.error)state.projects=projects.data||[];if(!news.error)state.news=news.data||[];if(!favorites.error)state.favorites=favorites.data||[]}
async function finishSession(session){state.session=session;state.user=session?.user||null;if(!state.user){state.profile=null;renderLogin();return}try{await loadProfile(state.user)}catch(error){console.error("[TECHNA PROFILE]",error);showToast(authError(error));return}if(!state.profile){if(state.user.app_metadata?.provider==="google"||state.user.identities?.some(identity=>identity.provider==="google")){googleProfileModal();return}showToast("O perfil ainda não foi criado no Supabase.");return}await loadData();renderApp()}
async function login(event){event.preventDefault();const form=event.currentTarget,message=document.getElementById("login-message"),button=form.querySelector('button[type="submit"]');const identifier=form.elements.namedItem("identifier")?.value?.trim(),password=form.elements.namedItem("password")?.value||"";message.textContent="";if(!identifier){message.textContent="Informe seu e-mail ou username.";return}if(password.length<6){message.textContent="A senha precisa ter pelo menos 6 caracteres.";return}button.disabled=true;button.textContent="Entrando...";try{const email=await resolveUsername(identifier);if(!email){message.textContent="E-mail ou username não encontrado.";return}const result=await supabaseClient.auth.signInWithPassword({email,password});if(result.error)throw result.error;await finishSession(result.data.session)}catch(error){console.error("[TECHNA LOGIN]",error);message.textContent=authError(error)}finally{button.disabled=false;button.textContent="Entrar"}}
async function register(event){event.preventDefault();const form=event.currentTarget,message=document.getElementById("account-message"),button=form.querySelector('button[type="submit"]');const nome=form.elements.namedItem("nome")?.value?.trim(),username=form.elements.namedItem("username")?.value?.trim().toLowerCase(),email=form.elements.namedItem("email")?.value?.trim().toLowerCase(),password=form.elements.namedItem("password")?.value||"",tipo=form.elements.namedItem("tipo")?.value||"aluno",curso=form.elements.namedItem("curso")?.value||null;message.textContent="";if(!nome){message.textContent="Informe seu nome completo.";return}if(!/^[a-z0-9_]{3,30}$/.test(username||"")){message.textContent="Username inválido. Use 3 a 30 caracteres minúsculos, números ou _.";return}if(!email||!email.includes("@")){message.textContent="Informe um e-mail válido.";return}if(password.length<6){message.textContent="A senha precisa ter pelo menos 6 caracteres.";return}if(tipo==="aluno"&&!curso){message.textContent="Escolha seu curso.";return}button.disabled=true;button.textContent="Criando conta...";try{const result=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:APP_URL,data:{nome,username,tipo_solicitado:tipo,curso:tipo==="aluno"?curso:null}}});if(result.error)throw result.error;message.className="message ok";message.textContent=result.data?.session?"Cadastro realizado com sucesso.":"Cadastro criado. Confirme o e-mail antes de entrar.";if(result.data?.session){await finishSession(result.data.session);closeModal()}}catch(error){console.error("[TECHNA CADASTRO]",error);message.textContent=authError(error)}finally{button.disabled=false;button.textContent="Criar conta"}}
async function saveGoogleProfile(event){event.preventDefault();const form=event.currentTarget,message=document.getElementById("google-profile-message"),button=form.querySelector('button[type="submit"]');const nome=form.elements.namedItem("nome").value.trim(),username=form.elements.namedItem("username").value.trim().toLowerCase(),curso=form.elements.namedItem("curso").value;if(!nome){message.textContent="Informe seu nome.";return}if(!/^[a-z0-9_]{3,30}$/.test(username)){message.textContent="Username inválido. Use letras minúsculas, números ou _.";return}if(!curso){message.textContent="Escolha seu curso.";return}button.disabled=true;try{const result=await supabaseClient.from("profiles").upsert({id:state.user.id,nome,email:state.user.email,username,curso,foto_url:state.user.user_metadata?.avatar_url||state.user.user_metadata?.picture||null,tipo_usuario:"aluno",tipo_solicitado:"aluno"},{onConflict:"id"});if(result.error)throw result.error;closeModal();await finishSession(state.session)}catch(error){console.error("[TECHNA GOOGLE PROFILE]",error);message.textContent=authError(error)}finally{button.disabled=false}}
async function oauthLogin(provider){try{const result=await supabaseClient.auth.signInWithOAuth({provider,options:{redirectTo:APP_URL,queryParams:provider==="google"?{access_type:"offline",prompt:"select_account"}:undefined}});if(result.error)throw result.error}catch(error){console.error("[TECHNA OAUTH]",error);showToast(authError(error))}}
async function sendPasswordReset(event){event.preventDefault();const email=document.getElementById("forgot-email").value.trim(),message=document.getElementById("forgot-message");try{const result=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});if(result.error)throw result.error;closeModal();showToast("Confira seu e-mail para redefinir a senha.")}catch(error){message.textContent=authError(error)}}
document.addEventListener("submit",event=>{if(event.target.id==="login-form")login(event);if(event.target.id==="account-form")register(event);if(event.target.id==="google-profile-form")saveGoogleProfile(event);if(event.target.id==="forgot-form")sendPasswordReset(event);if(event.target.id==="project-form")showToast("Criação de projeto será ampliada na próxima etapa")});document.addEventListener("click",event=>{const page=event.target.closest("[data-page]"),action=event.target.closest("[data-action]"),oauth=event.target.closest("[data-oauth]"),toggle=event.target.closest("[data-toggle-password]");if(page){event.preventDefault();goPage(page.dataset.page)}if(oauth)oauthLogin(oauth.dataset.oauth);if(toggle){const input=document.getElementById(toggle.dataset.togglePassword);if(input)input.type=input.type==="password"?"text":"password"}if(action){const name=action.dataset.action;if(name==="create-account")registerModal();if(name==="forgot-password")openForgot();if(name==="new-project")projectModal();if(name==="toggle-menu")document.getElementById("sidebar")?.classList.toggle("open");if(name==="logout")supabaseClient.auth.signOut();if(name==="notifications")showToast("Você não tem novas notificações.")}});modalRoot.addEventListener("click",event=>{if(event.target.hasAttribute("data-close-modal"))closeModal()});supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session&&session.user?.id!==state.user?.id)finishSession(session);if(!session&&state.user)finishSession(null)});(async()=>{const result=await supabaseClient.auth.getSession();await finishSession(result.data?.session||null)})();
</script>
</body>
</html>
