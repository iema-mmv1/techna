Base: paste.txt estável enviado pelo usuário.
Ajuste exclusivo: a imagem do carrossel agora ocupa toda a área visual,
sem faixa lateral, usando imagem de fundo com cover e posicionamento central.
O conteúdo do projeto permanece visível ao lado.
-->

.news-carousel-shell{
  position:relative;
  overflow:hidden;
  padding:0 48px;
  border-radius:20px;
  background:#321047;
}

.news-carousel-track{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
}

.news-carousel-track::-webkit-scrollbar{
  display:none;
}

.news-carousel-slide{
  display:flex;
  flex-direction:column;
  flex:0 0 calc((100% - 12px)/2);
  min-width:0;
  min-height:370px;
  overflow:hidden;
  border-radius:16px;
  background:#321047;
  color:#fff;
  scroll-snap-align:start;
}

.news-carousel-image{
  flex:0 0 190px;
  min-height:190px;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

.news-carousel-copy{
  display:flex;
  flex:1;
  flex-direction:column;
  justify-content:flex-start;
  min-width:0;
  padding:18px;
}

.news-carousel-copy small{
  color:#e9ddef;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.news-carousel-copy h3{
  margin:9px 0;
  font-size:clamp(1.05rem,1.7vw,1.45rem);
  line-height:1.3;
}

.news-carousel-copy p{
  display:-webkit-box;
  overflow:hidden;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  color:#f2e8f4;
  line-height:1.5;
}

.news-carousel-copy .btn{
  margin-top:auto;
}

.news-carousel-arrow{
  position:absolute;
  z-index:3;
  top:50%;
  display:grid;
  width:42px;
  height:42px;
  place-items:center;
  color:var(--p);
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:0 5px 18px #16051d66;
  transform:translateY(-50%);
  font-size:1.35rem;
  font-weight:900;
  transition:.2s;
}

.news-carousel-arrow:hover{
  background:var(--lime);
  transform:translateY(-50%) scale(1.08);
}

.news-carousel-arrow.prev{left:8px}
.news-carousel-arrow.next{right:8px}

.news-carousel-dots{
  display:flex;
  justify-content:center;
  gap:7px;
  padding:10px 0 13px;
  background:#321047;
}

.news-carousel-dot{
  width:8px;
  height:8px;
  padding:0;
  border:0;
  border-radius:50%;
  background:#d9c5dd;
  transition:.2s;
}

.news-carousel-dot.active{
  width:25px;
  border-radius:99px;
  background:var(--lime);
}

@media(max-width:820px){
  .news-carousel-slide{
    flex-basis:100%;
  }

  .news-carousel-image{
    flex-basis:220px;
    min-height:220px;
  }
}
body:has(.login) .sidebar,body:has(.login) .layout>.sidebar{display:none!important}

/* Editar perfil: sem barra interna quando todo o conteúdo couber */
.modal:has(.profile-avatar-editor){max-height:none;overflow:hidden}
.modal-bg:has(.modal .profile-avatar-editor){overflow:hidden}

@media(max-width:1100px){.stats{grid-template-columns:repeat(4,minmax(0,112px))}.dash-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media(max-width:820px){.login{display:block;height:100dvh;min-height:0;overflow:hidden}.login-art{display:none}.login-panel{display:grid;place-items:center;width:100%;height:100dvh;min-height:0;padding:18px;overflow:hidden}.auth{width:min(100%,430px)}.auth h2{font-size:clamp(1.65rem,8vw,2.25rem)}.layout{display:block}.sidebar{position:fixed;z-index:30;left:0;top:0;width:265px;height:100dvh;transform:translateX(-105%);transition:.25s}.sidebar.open{transform:none}.menu{display:inline-grid;margin-right:8px}.news-carousel-slide{grid-template-columns:1fr}.news-carousel-image{min-height:220px}.news-carousel-copy{padding:20px}.form-grid,.role-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.modal{width:100%;max-height:calc(100dvh - 16px);padding:16px}.detail-cover{height:190px}.detail-grid{grid-template-columns:1fr;gap:14px}.modal:has(.profile-avatar-editor){width:100%;max-height:none;overflow:hidden}}
@media(max-height:700px){.login-panel{padding-top:10px;padding-bottom:10px}.auth h2{margin-top:3px;font-size:1.65rem}.auth-intro{margin-bottom:8px}.field{margin-bottom:6px}.input,.select,.textarea{padding-top:9px;padding-bottom:9px}.divider{margin:8px 0}}
@media(max-width:560px){
  .stats{
    grid-template-columns:repeat(12,minmax(0,1fr));
    gap:8px;
  }

  .stats>.stat{
    grid-column:span 3;
    padding:7px 5px;
  }

  .stats>.stat:nth-child(5){
  grid-column:2 / span 3;
}

.stats>.stat:nth-child(6){
  grid-column:6 / span 3;
}

.stats>.stat:nth-child(7){
  grid-column:10 / span 3;
}

  .stat small{
    font-size:.65rem;
    line-height:1.15;
  }

  .stat b{
    font-size:1.2rem;
  }

  .project-grid,.social-login{grid-template-columns:1fr}
  .card{padding:17px}
  .horizontal{grid-auto-columns:70vw}
  .topbar h1{font-size:1.7rem}
  .news-carousel-shell{padding-inline:40px}
  .project-cover,.project-cover img{height:210px;min-height:210px}
  .modal{max-height:calc(100dvh - 12px);padding:14px}
  .detail-cover{height:145px;margin-bottom:14px}
  .login-panel{padding:14px}
}
.project-hero {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  align-items: center;
  gap: 18px;
}

.project-main-cover {
  display: grid;
  width: 210px;
  aspect-ratio: 1;
  place-items: center;
  overflow: hidden;
  border-radius: 15px;
  background: #f7f2f8;
}

.project-main-cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.project-summary {
  min-width: 0;
}

.project-summary h2 {
  margin: 5px 0 8px;
  color: var(--p);
}

.project-summary p {
  margin: 8px 0;
}

.project-section {
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
}

.project-section h3 {
  margin: 0 0 12px;
  color: var(--p);
}

.project-album-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.project-album-item {
  min-width: 0;
  margin: 0;
}

.project-album-item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 11px;
}

.project-album-item figcaption {
  margin-top: 4px;
  color: var(--muted);
  font-size: .76rem;
}

.project-people-list {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.project-person {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
}

.project-person-avatar {
  display: grid;
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  background: #f1e8f3;
  color: var(--p);
  font-size: .75rem;
  font-weight: 800;
}

.project-person-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.project-person strong,
.project-person small {
  display: block;
}

.project-person small {
  color: var(--muted);
  font-size: .72rem;
}

@media (max-width: 620px) {
  .project-hero {
    grid-template-columns: 105px minmax(0, 1fr);
    gap: 12px;
  }

  .project-main-cover {
    width: 105px;
  }

  .project-album-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 420px) {
  .project-hero {
    grid-template-columns: 1fr;
  }

  .project-main-cover {
    width: min(100%, 180px);
  }

  .project-album-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.album-editor {
  grid-column: 1 / -1;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #faf8fb;
}

.album-editor h3 {
  margin: 0 0 5px;
  color: var(--p);
}

.album-editor > p {
  margin: 0 0 12px;
  color: var(--muted);
}

.album-editor-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.album-editor-item {
  min-width: 0;
  padding: 7px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.album-editor-item.is-cover {
  border-color: var(--lime);
}

.album-editor-item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
}

.album-editor-item small {
  display: block;
  margin: 5px 0;
  color: var(--muted);
}

.album-editor-item button {
  width: 100%;
  min-height: 32px;
  margin-top: 5px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--p);
  font-size: .75rem;
  font-weight: 800;
}

.album-editor-item button:disabled {
  cursor: default;

function stopCarousel(){if(carouselState.timer){clearInterval(carouselState.timer);carouselState.timer=null}}
function updateCarousel(index,behavior="smooth"){
  const root=document.querySelector("[data-news-carousel]");
  const track=root?.querySelector("[data-news-carousel-track]");
  const slides=root
    ?[...root.querySelectorAll("[data-news-slide]")]
    :[];

  if(!track||!slides.length)return;

  const count=slides.length;
  carouselState.index=(index+count)%count;

  const target=slides[carouselState.index];

  track.scrollTo({
    left:target.offsetLeft-track.offsetLeft,
    behavior
  });

  root.querySelectorAll("[data-news-carousel-dot]")
    .forEach((dot,i)=>{
      dot.classList.toggle(
        "active",
        i===carouselState.index
      );
    });
}
function startCarousel(){
  stopCarousel();

  const count=document.querySelectorAll(
    "[data-news-slide]"
  ).length;

  if(count>1){
    carouselState.timer=setInterval(()=>{
      if(!carouselState.paused){
        updateCarousel(carouselState.index+1);
      }
    },5000);
  }
}
function initCarousel(){
  stopCarousel();

  const root=document.querySelector("[data-news-carousel]");
  const track=root?.querySelector(
    "[data-news-carousel-track]"
  );

  if(!root||!track)return;

  carouselState.index=0;
  carouselState.paused=false;

  const slides=[...root.querySelectorAll(
    "[data-news-slide]"
  )];

  if(slides.length>1){
    const copies=window.innerWidth>820?2:1;

    for(let i=0;i<copies;i++){
      const clone=slides[i%slides.length].cloneNode(true);
      clone.removeAttribute("data-news-slide");
      clone.setAttribute("aria-hidden","true");
      clone.querySelectorAll("button").forEach(button=>{
        button.tabIndex=-1;
      });
      track.appendChild(clone);
    }
  }

  root.querySelector("[data-news-carousel-prev]")
    ?.addEventListener("click",()=>{
      updateCarousel(carouselState.index-1);
      startCarousel();
    });

  root.querySelector("[data-news-carousel-next]")
    ?.addEventListener("click",()=>{
      updateCarousel(carouselState.index+1);
      startCarousel();
    });

  root.querySelectorAll("[data-news-carousel-dot]")
    .forEach(dot=>{
      dot.addEventListener("click",()=>{
        updateCarousel(
          Number(dot.dataset.newsCarouselDot)
        );
        startCarousel();
      });
    });

  root.addEventListener("mouseenter",()=>{
    carouselState.paused=true;
  });

  root.addEventListener("mouseleave",()=>{
    carouselState.paused=false;
  });

  let startX=0;

  track.addEventListener("touchstart",event=>{
    startX=event.touches[0].clientX;
  },{passive:true});

  track.addEventListener("touchend",event=>{
    const delta=startX-event.changedTouches[0].clientX;

    if(Math.abs(delta)>45){
      updateCarousel(
        carouselState.index+(delta>0?1:-1)
      );
      startCarousel();
    }
  },{passive:true});

  startCarousel();
}

async function getActivities(){
  let updates=[];

  if(state.user){
    const r=await supabaseClient
      .from("project_updates")
      .select("*,profiles(nome)")
      .order("created_at",{ascending:false});

    if(r.error){
      console.error("Erro ao carregar atualizações:",r.error);
    }else{
      updates=r.data||[];
    }
  }

  const grouped={};

  updates.forEach(u=>{
    (grouped[u.project_id]??=[]).push(u);
  });

  const authorIds=[
    ...new Set(
      state.projects
        .map(p=>p.autora_id)
        .filter(Boolean)
    )
  ];

  const authorNames=new Map();

  if(authorIds.length){
    const result=await supabaseClient
      .from("profiles")
      .select("id,nome,username")
      .in("id",authorIds);

    if(result.error){
      console.error("Erro ao carregar autores:",result.error);
    }else{
      (result.data||[]).forEach(profile=>{
        authorNames.set(
          String(profile.id),
          profile.nome||profile.username||"Integrante da TECHNA"
        );
      });
    }
  }

  return state.projects
    .flatMap(project=>{
      const projetoComAutor={
        ...project,
        autor_nome:
          authorNames.get(String(project.autora_id))||
          project.autor_nome||
          "Integrante da TECHNA"
      };

      return projectActivity(
        projetoComAutor,
        grouped[project.id]||[]
      );
    })
    .sort(
      (a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)
    );
}

async function trashPage() {
  const ownedResult = await supabaseClient
    .from("projects")
    .select("id,titulo,descricao,deleted_at")
    .eq("autora_id", state.user.id);

  if (ownedResult.error) {
    console.error("Erro ao carregar lixeira:", ownedResult.error);
    frame(`
      <section class="techna-trash-page">
        <p class="message">Não foi possível carregar a lixeira.</p>
      </section>
    `);
    return;
  }

  const ownedProjects = ownedResult.data || [];
  const deletedProjects = ownedProjects
    .filter(project => project.deleted_at)
    .sort((a, b) =>
      new Date(b.deleted_at) - new Date(a.deleted_at)
    );

  let deletedImages = [];

  if (ownedProjects.length) {
    const imagesResult = await supabaseClient
      .from("project_images")
      .select("id,project_id,arquivo_url,deleted_at")
      .in(
        "project_id",
        ownedProjects.map(project => project.id)
      )
      .not("deleted_at", "is", null)
      .order("deleted_at", { ascending: false });

    if (imagesResult.error) {
      console.error(
        "Erro ao carregar fotos da lixeira:",
        imagesResult.error
      );
      frame(`
        <section class="techna-trash-page">
          <p class="message">
            Não foi possível carregar as fotos da lixeira.
          </p>
        </section>
      `);
      return;
    }

    deletedImages = imagesResult.data || [];
  }

  const projectTitle = new Map(
    ownedProjects.map(project => [
      String(project.id),
      project.titulo
    ])
  );

  frame(`
    <section class="techna-trash-page">
      <p class="muted">
        Projetos e fotos removidos aparecem aqui.
        Você pode restaurá-los.
      </p>

      <h2>Projetos</h2>
      ${
        deletedProjects.length
          ? deletedProjects.map(project => `
              <article class="techna-trash-item">
                <div>
                  <h3>${esc(project.titulo)}</h3>
                  <p>${esc(project.descricao || "")}</p>
                  <small class="muted">
                    Movido para a lixeira em
                    ${new Date(project.deleted_at)
                      .toLocaleString("pt-BR")}
                  </small>
                </div>

                <button type="button"
                        class="btn btn-secondary"
                        data-action="restore-project"
                        data-project="${esc(project.id)}">
                  Restaurar projeto
                </button>
              </article>
            `).join("")
          : `<p class="muted">Nenhum projeto na lixeira.</p>`
      }

      <h2>Fotos</h2>
      ${
        deletedImages.length
          ? deletedImages.map(image => `
              <article class="techna-trash-item">
                <div>
                  <img
                    src="${esc(image.arquivo_url)}"
                    alt="Foto removida do projeto"
                    style="max-width:180px;max-height:120px;
                           object-fit:cover;border-radius:10px;">

                  <p>
                    Projeto:
                    ${esc(
                      projectTitle.get(String(image.project_id))
                      || "Projeto"
                    )}
                  </p>

                  <small class="muted">
                    Movida para a lixeira em
                    ${new Date(image.deleted_at)
                      .toLocaleString("pt-BR")}
                  </small>
                </div>

                <button type="button"
                        class="btn btn-secondary"
                        data-action="restore-image"
                        data-image="${esc(image.id)}"
                        data-project="${esc(image.project_id)}">
                  Restaurar foto
                </button>
              </article>
            `).join("")
          : `<p class="muted">Nenhuma foto na lixeira.</p>`
      }
    </section>
  `);
}
async function restoreImage(imageId, projectId) {
  const result = await supabaseClient
    .from("project_images")
    .update({ deleted_at: null })
    .eq("id", imageId)
    .eq("project_id", projectId)
    .not("deleted_at", "is", null)
    .select("id")
    .single();

  if (result.error) {
    console.error("Erro ao restaurar foto:", result.error);
    showToast("Não foi possível restaurar a foto.");
    return;
  }

  showToast("Foto restaurada para o álbum do projeto.");
  await trashPage();
}

async function restoreProject(id) {
  if (!state.user || !id) return;

  const result = await supabaseClient
    .from("projects")
    .update({deleted_at: null})
    .eq("id", id)
    .eq("autora_id", state.user.id)
    .not("deleted_at", "is", null)
    .select("id")
    .maybeSingle();

  if (result.error) {
    showToast(authError(result.error));
    return;
  }

  if (!result.data) {
    showToast("Não foi possível restaurar o projeto.");
    return;
  }

  await loadData();
  await goPage("trash");
  showToast("Projeto restaurado com sucesso.");
}

async function loadPendingProjectRequests(projectId){
  const container=document.getElementById(
    "project-pending-requests"
  );
  if(!container)return;

  const result=await supabaseClient
    .from("project_participation_requests")
    .select("id,requester_id,mensagem,created_at")
    .eq("project_id",projectId)
    .eq("status","pendente")
    .order("created_at",{ascending:true});

  if(!container.isConnected)return;

  if(result.error){
    console.error("Erro ao carregar solicitações:",result.error);
    container.innerHTML=
      `<p class="message">
        Não foi possível carregar as solicitações.
      </p>`;
    return;
  }

  const requests=result.data||[];

  if(!requests.length){
    container.innerHTML=
      `<p class="muted">Nenhuma solicitação pendente.</p>`;
    return;
  }

  const ids=[...new Set(
    requests.map(request=>request.requester_id)
  )];

  const profilesResult=await supabaseClient
    .from("profiles")
    .select("id,nome,username,foto_url")
    .in("id",ids);

  if(!container.isConnected)return;

  if(profilesResult.error){
    console.error(
      "Erro ao carregar solicitantes:",
      profilesResult.error
    );
    container.innerHTML=
      `<p class="message">
        Não foi possível carregar os solicitantes.
      </p>`;
    return;
  }

  const profileById=new Map(
    (profilesResult.data||[]).map(profile=>[
      String(profile.id),
      profile
    ])
  );

  container.innerHTML=requests.map(request=>{
    const profile=profileById.get(
      String(request.requester_id)
    );
    const name=profile?.nome||
               profile?.username||
               "Usuário";

    return `
      <article class="participation-request">
        <span class="project-person-avatar">
          ${
            profile?.foto_url
              ? `<img src="${esc(profile.foto_url)}"
                      alt="Foto de ${esc(name)}">`
              : esc(initials(name))
          }
        </span>

        <div class="participation-request-info">
          <strong>${esc(name)}</strong>
          ${
            request.mensagem
              ? `<p>${esc(request.mensagem)}</p>`
              : `<p class="muted">Sem mensagem.</p>`
          }
        </div>

        <div class="participation-request-actions">
          <button type="button"
                  class="btn btn-primary"
                  data-action="decide-participation"
                  data-request-id="${esc(request.id)}"
                  data-project-id="${esc(projectId)}"
                  data-decision="aceita">
            Aceitar
          </button>

          <button type="button"
                  class="btn btn-danger"
                  data-action="decide-participation"
                  data-request-id="${esc(request.id)}"
                  data-project-id="${esc(projectId)}"
                  data-decision="recusada">
            Recusar
          </button>
        </div>
      </article>
    `;
  }).join("");
}
async function loadProjectInteractions(projectId){
  const [likes,comments,request]=await Promise.all([
    supabaseClient
      .from("project_likes")
      .select("user_id")
      .eq("project_id",projectId),

    supabaseClient
      .from("project_comments")
      .select("id,project_id,author_id,conteudo,status,created_at")
      .eq("project_id",projectId)
      .eq("status","publicado")
      .order("created_at",{ascending:false}),

    state.user
      ?supabaseClient
        .from("project_participation_requests")
        .select("*")
        .eq("project_id",projectId)
        .eq("requester_id",state.user.id)
        .maybeSingle()
      :Promise.resolve({data:null,error:null})
  ]);

  if(comments.error){
    console.error("Erro ao carregar comentários:",comments.error);
  }

  const commentList=comments.error?[]:(comments.data||[]);
  const authorIds=[
    ...new Set(
      commentList.map(comment=>comment.author_id).filter(Boolean)
    )
  ];
  const profilesById=new Map();

  if(authorIds.length){
    const authors=await supabaseClient
      .from("profiles")
      .select("id,nome,username,foto_url")
      .in("id",authorIds);

    if(authors.error){
      console.error(
        "Erro ao carregar autores dos comentários:",
        authors.error
      );
    }else{
      (authors.data||[]).forEach(profile=>{
        profilesById.set(String(profile.id),profile);
      });
    }
  }

  return {
    likes:likes.error?[]:(likes.data||[]),
    comments:commentList.map(comment=>({
      ...comment,
      profiles:profilesById.get(String(comment.author_id))||null
    })),
    request:request.error?null:request.data
  };
}

let editingProjectAlbum=null;

async function setupProjectAlbumEditor(project){
  const response=await supabaseClient
    .from("project_images")
    .select("id,arquivo_url,ordem")
    .eq("project_id",project.id)
    .is("deleted_at",null)
    .order("ordem",{ascending:true});

  const container=document.getElementById("edit-project-album");
  if(!container)return;

  if(response.error){
    container.innerHTML=
      `<p class="message">Não foi possível carregar o álbum.</p>`;
    console.error(response.error);
    return;
  }

  const saved=(response.data||[]).map(image=>({
    id:image.id,
    url:image.arquivo_url,
    file:null,
    removed:false
  }));

  if(
    project.imagem_capa_url &&
    !saved.some(image=>image.url===project.imagem_capa_url)
  ){
    saved.unshift({
      id:null,
      url:project.imagem_capa_url,
      file:null,
      removed:false
    });
  }

  editingProjectAlbum={
    projectId:String(project.id),
    images:saved,
    coverUrl:project.imagem_capa_url||saved[0]?.url||null
  };

  renderProjectAlbumEditor();

  document
    .getElementById("edit-project-images")
    ?.addEventListener("change",event=>{
      const files=[...event.target.files]
        .filter(file=>file.type.startsWith("image/"));

      for(const file of files){
        editingProjectAlbum.images.push({
          id:null,
          url:URL.createObjectURL(file),
          file,
          removed:false
        });
      }

      if(!editingProjectAlbum.coverUrl && files.length){
        editingProjectAlbum.coverUrl=
          editingProjectAlbum.images.at(-files.length).url;
      }

      event.target.value="";
      renderProjectAlbumEditor();
    });
}

function renderProjectAlbumEditor(){
  const album=editingProjectAlbum;
  const container=document.getElementById("edit-project-album");
  if(!album||!container)return;

  const visible=album.images
    .map((image,index)=>({...image,index}))
    .filter(image=>!image.removed);

  container.innerHTML=visible.length
    ?visible.map(image=>`
      <div class="album-editor-item
                  ${image.url===album.coverUrl?"is-cover":""}">
        <img src="${esc(image.url)}"
             alt="Imagem do projeto">

        <small>
          ${image.url===album.coverUrl?"Capa atual":"Foto do álbum"}
        </small>

        ${
          image.url!==album.coverUrl
            ? `<button type="button"
                       data-album-cover="${image.index}">
                 Usar como capa
               </button>`
            : ""
        }

        <button type="button"
                data-album-remove="${image.index}">
          Remover
        </button>
      </div>
    `).join("")
    :`<p class="muted">Nenhuma imagem adicionada.</p>`;
}

async function saveProjectEdit(e){
  e.preventDefault();

  const form=e.target;
  const id=form.dataset.project;
  const project=state.projects.find(
    x=>String(x.id)===String(id)
  );
  const message=document.getElementById(
    "edit-project-message"
  );
  const album=editingProjectAlbum;

  if(
    !project ||
    !state.user ||
    String(project.autora_id)!==String(state.user.id)
  ){
    message.textContent=
      "Você não tem permissão para editar este projeto.";
    return;
  }

  if(!album||album.projectId!==String(id)){
    message.textContent=
      "O álbum ainda não carregou. Aguarde e tente novamente.";
    return;
  }

  const button=form.querySelector('button[type="submit"]');
  button.disabled=true;

  try{
    const stepsResult=await supabaseClient
      .from("project_steps")
      .select("titulo")
      .eq("project_id",id)
      .eq("concluida",true);

    if(stepsResult.error)throw stepsResult.error;

    const concluidas=new Set(
      (stepsResult.data||[]).map(step=>step.titulo)
    );

    const novasEtapas=[
      ...form.querySelectorAll(
        '[name="edit-step"]:checked:not(:disabled)'
      )
    ]
      .map(input=>Number(input.value))
      .filter(index=>
        Number.isInteger(index) &&
        defaultSteps[index] &&
        !concluidas.has(defaultSteps[index].titulo)
      );

    if(novasEtapas.length){
      const insertResult=await supabaseClient
        .from("project_steps")
        .insert(
          novasEtapas.map(index=>({
            project_id:id,
            titulo:defaultSteps[index].titulo,
            ordem:index+1,
            concluida:true
          }))
        );

      if(insertResult.error)throw insertResult.error;

      novasEtapas.forEach(index=>{
        concluidas.add(defaultSteps[index].titulo);
      });
    }

    const progresso=Math.min(
      100,
      defaultSteps.reduce(
        (total,step)=>
          total+(
            concluidas.has(step.titulo)
              ?Number(step.percentual)
              :0
          ),
        0
      )
    );

    const status=
      progresso===100
        ?"concluido"
        :progresso===0
          ?"planejamento"
          :project.status==="em_testes"
            ?"em_testes"
            :"em_andamento";

    let ordem=0;

    for(const image of album.images){
      if(image.removed||!image.file)continue;

      const uploadedUrl=await uploadProjectCover(image.file);

      const insertResult=await supabaseClient
        .from("project_images")
        .insert({
          project_id:id,
          uploaded_by:state.user.id,
          arquivo_url:uploadedUrl,
          ordem:ordem++
        })
        .select("id")
        .single();

      if(insertResult.error)throw insertResult.error;

      if(album.coverUrl===image.url){
        album.coverUrl=uploadedUrl;
      }

      URL.revokeObjectURL(image.url);
      image.url=uploadedUrl;
      image.id=insertResult.data.id;
      image.file=null;
    }

    for(const image of album.images){
      if(!image.removed||!image.id)continue;

      const removeResult=await supabaseClient
        .from("project_images")
        .update({
          deleted_at:new Date().toISOString()
        })
        .eq("id",image.id)
        .eq("project_id",id)
        .is("deleted_at",null)
        .select("id")
        .single();

      if(removeResult.error)throw removeResult.error;
    }

    const imagem_capa_url=album.coverUrl||null;

    const result=await supabaseClient
      .from("projects")
      .update({
        titulo:form.elements.titulo.value.trim(),
        descricao:form.elements.descricao.value.trim(),
        objetivo:form.elements.objetivo.value.trim()||null,
        area:
          form.elements.area.value.trim()||
          "Não informada",
        tipo_participacao:
          form.elements.tipo_participacao.value,
        imagem_capa_url,
        progresso,
        status
      })
      .eq("id",id)
      .eq("autora_id",state.user.id)
      .select()
      .single();

    if(result.error)throw result.error;

    editingProjectAlbum=null;
    closeModal();
    await loadData();
    await goPage(state.page);
    showToast("Projeto, etapas e álbum atualizados.");
  }catch(error){
    console.error("Erro ao salvar projeto/álbum:",error);
    message.textContent=authError(error);
  }finally{
    button.disabled=false;
  }
}
async function deleteProject(project) {
  if (
    !project ||
    !state.user ||
    String(project.autora_id) !== String(state.user.id)
  ) {
    showToast("Você não tem permissão para mover este projeto.");
    return;
  }

    const confirmed = await showConfirmation({
    title: "Mover projeto para a lixeira?",
    message: `Tem certeza que deseja mover o projeto “${project.titulo}” para a lixeira? Você poderá restaurá-lo depois.`,
    confirmText: "Mover para a lixeira"
  });

  if (!confirmed) return;

  const result = await supabaseClient
    .from("projects")
    .update({deleted_at: new Date().toISOString()})
    .eq("id", project.id)
    .eq("autora_id", state.user.id)
    .is("deleted_at", null)
    .select("id")
    .maybeSingle();

  if (result.error) {
    showToast(authError(result.error));
    return;
  }

  if (!result.data) {
    showToast("Não foi possível mover o projeto para a lixeira.");
    return;
  }

  closeModal();
  await loadData();
  await goPage(state.page);
  showToast("Projeto movido para a lixeira.");
}
async function toggleProjectLike(projectId){
  if(!state.user){
    showToast("Entre para curtir projetos.");
    return;
  }

  const existing=await supabaseClient
    .from("project_likes")
    .select("id")
    .eq("project_id",projectId)
    .eq("user_id",state.user.id)
    .maybeSingle();

  if(existing.error){
    showToast(authError(existing.error));
    return;
  }

  const result=existing.data
    ?await supabaseClient
      .from("project_likes")
      .delete()
      .eq("id",existing.data.id)
    :await supabaseClient
      .from("project_likes")
      .insert({
        project_id:projectId,
        user_id:state.user.id
      });

  if(result.error){
    showToast(authError(result.error));
    return;
  }

  await openProject(projectId);
}

  try{

      .from("project_participation_requests")
      .delete()
      .eq("project_id",projectId)
      .eq("requester_id",state.user.id)
      .eq("status","pendente")
      .select("id");

      showToast(authError(result.error));

        "Não foi possível cancelar o pedido. Verifique a permissão de cancelamento."

    button.disabled=false;
  }
}

async function loadData(){
  if(!state.user)return;

  const [p,n,f]=await Promise.all([
    supabaseClient
      .from("projects")
      .select("*")
      .is("deleted_at",null)
      .order("created_at",{ascending:false}),
    supabaseClient
      .from("news")
      .select("*")
      .eq("status","publicado"),
    supabaseClient
      .from("favorites")
      .select("*")
      .eq("user_id",state.user.id)
  ]);

  if(!n.error)state.news=n.data||[];
  if(!f.error)state.favorites=f.data||[];

  if(p.error){
    console.error("Erro ao carregar projetos:",p.error);
    return;
  }

  const projects=p.data||[];

  const authorIds=[
    ...new Set(
      projects.map(project=>project.autora_id).filter(Boolean)
    )
  ];

  const authorNames=new Map();

  if(authorIds.length){
    const authors=await supabaseClient
      .from("profiles")
      .select("id,nome,username")
      .in("id",authorIds);

    if(authors.error){
      console.error("Erro ao carregar nomes dos autores:",authors.error);
    }else{
      (authors.data||[]).forEach(profile=>{
        authorNames.set(
          String(profile.id),
          profile.nome||profile.username||
            "Integrante da TECHNA"
        );
      });
    }
  }

  state.projects=projects.map(project=>({
    ...project,
    autor_nome:
      authorNames.get(String(project.autora_id))||
      "Integrante da TECHNA"
  }));
}
async function finishSession(session){state.session=session;state.user=session?.user||null;if(!state.user){state.profile=null;renderLogin();return}await loadProfile(state.user);if(!state.profile){if(state.user.identities?.some(x=>x.provider==="google")){googleProfileModal();return}showToast("Perfil não encontrado.");return}await loadData();renderApp()}
async function login(e){e.preventDefault();const f=e.target,m=document.getElementById("login-message");try{const email=await resolveUsername(f.elements.identifier.value);if(!email){m.textContent="Usuário não encontrado.";return}const r=await supabaseClient.auth.signInWithPassword({email,password:f.elements.password.value});if(r.error)throw r.error;await finishSession(r.data.session)}catch(x){m.textContent=authError(x)}}async function register(e){e.preventDefault();const f=e.target,m=document.getElementById("account-message");try{const r=await supabaseClient.auth.signUp({email:f.elements.email.value,password:f.elements.password.value,options:{emailRedirectTo:APP_URL,data:{nome:f.elements.nome.value,username:f.elements.username.value.toLowerCase(),tipo_solicitado:f.elements.tipo.value,curso:f.elements.curso.value||null}}});if(r.error)throw r.error;m.className="message ok";m.textContent=r.data.session?"Cadastro realizado.":"Cadastro criado. Confirme o e-mail."}catch(x){m.textContent=authError(x)}}async function saveGoogle(e){e.preventDefault();const f=e.target,m=document.getElementById("google-profile-message");try{const r=await supabaseClient.from("profiles").update({nome:f.elements.nome.value,username:f.elements.username.value.toLowerCase(),curso:f.elements.curso.value}).eq("id",state.user.id);if(r.error)throw r.error;closeModal();await finishSession(state.session)}catch(x){m.textContent=authError(x)}}async function oauth(provider){const r=await supabaseClient.auth.signInWithOAuth({provider,options:{redirectTo:APP_URL}});if(r.error)showToast(authError(r.error))}async function forgot(e){e.preventDefault();const r=await supabaseClient.auth.resetPasswordForEmail(document.getElementById("forgot-email").value,{redirectTo:APP_URL});if(r.error)document.getElementById("forgot-message").textContent=authError(r.error);else{closeModal();showToast("Confira seu e-mail.")}}
async function uploadProjectCover(file){if(!file)return null;const path=`${state.user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const r=await supabaseClient.storage.from("project-covers").upload(path,file,{upsert:false});if(r.error)throw r.error;return supabaseClient.storage.from("project-covers").getPublicUrl(path).data.publicUrl}async function uploadProfilePhoto(file){if(!file)return state.profile?.foto_url||null;const path=`${state.user.id}/profile-${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const r=await supabaseClient.storage.from("project-covers").upload(path,file,{upsert:false});if(r.error)throw r.error;return supabaseClient.storage.from("project-covers").getPublicUrl(path).data.publicUrl}
async function createProject(e){
  e.preventDefault();

  const form=e.target;
  const message=document.getElementById("project-message");
  const button=form.querySelector('button[type="submit"]');

  button.disabled=true;

  try{
    const selected=[
      ...form.querySelectorAll('[name="step"]:checked')
    ];

    const progresso=selected.reduce(
      (sum,item)=>sum+Number(item.dataset.percent||0),
      0
    );

    const uploadedImages=[];

    for(const image of newProjectAlbum){
      const arquivo_url=await uploadProjectCover(image.file);

      uploadedImages.push({
        arquivo_url,
        cover:image.cover
      });
    }

    const selectedCover=uploadedImages.find(
      image=>image.cover
    );

    const created=await supabaseClient
      .from("projects")
      .insert({
        titulo:form.elements.titulo.value.trim(),
        descricao:form.elements.descricao.value.trim(),
        objetivo:form.elements.objetivo.value.trim()||null,
        area:form.elements.area.value.trim()||
          "Não informada",
        tipo_participacao:
          form.elements.tipo_participacao.value,
        autora_id:state.user.id,
        progresso,
        status:
          progresso===100
            ?"concluido"
            :progresso
              ?"em_andamento"
              :"planejamento",
        status_publicacao:"publicado",
        imagem_capa_url:
          selectedCover?.arquivo_url||null
      })
      .select()
      .single();

    if(created.error)throw created.error;

    const projectId=created.data.id;

    if(uploadedImages.length){
      const imagesResult=await supabaseClient
        .from("project_images")
        .insert(
          uploadedImages.map((image,index)=>({
            project_id:projectId,
            uploaded_by:state.user.id,
            arquivo_url:image.arquivo_url,
            ordem:index
          }))
        );

      if(imagesResult.error){
        throw new Error(
          "O projeto foi criado, mas não foi possível " +
          "registrar todas as fotos no álbum: " +
          imagesResult.error.message
        );
      }
    }

    if(selected.length){
      const stepsResult=await supabaseClient
        .from("project_steps")
        .insert(
          selected.map((item,index)=>({
            project_id:projectId,
            titulo:
              defaultSteps[Number(item.value)].titulo,
            ordem:index+1,
            concluida:true
          }))
        );

      if(stepsResult.error){
        throw new Error(
          "O projeto foi criado, mas não foi possível " +
          "registrar o roadmap: " +
          stepsResult.error.message
        );
      }
    }

    newProjectAlbum.forEach(image=>{
      URL.revokeObjectURL(image.url);
    });

    newProjectAlbum=[];
    closeModal();
    await loadData();
    await goPage("projects");
    showToast("Projeto criado com álbum e capa.");
  }catch(error){
    console.error("Erro ao criar projeto:",error);
    message.textContent=authError(error);
  }finally{
    button.disabled=false;
  }
}
async function createUpdate(e){e.preventDefault();const f=e.target,id=f.dataset.project;const r=await supabaseClient.from("project_updates").insert({project_id:id,author_id:state.user.id,titulo:f.elements.titulo.value.trim(),descricao:f.elements.descricao.value.trim()});if(r.error){showToast(authError(r));return}closeModal();showToast("Atualização publicada como notícia.");await goPage("news")}
async function saveProfile(e){
  e.preventDefault();

  const form=e.target;
  const message=document.getElementById("profile-message");
  const button=form.querySelector('button[type="submit"]');
  const password=form.elements.password.value;

  if(password && password!==form.elements.password2.value){
    message.textContent="As senhas não conferem.";
    return;
  }

  button.disabled=true;

  try{
    const foto_url=await uploadProfilePhoto(
      form.elements.foto.files?.[0]
    );

    const changes={
      nome:form.elements.nome.value.trim(),
      username:form.elements.username.value.trim().toLowerCase(),
      foto_url
    };

    if(state.profile?.tipo_usuario==="professor"){
      changes.instituicao=
        form.elements.instituicao.value.trim()||null;
      changes.areas_atuacao=
        form.elements.areas_atuacao.value.trim()||null;
      changes.biografia=
        form.elements.biografia.value.trim()||null;
    }else{
      changes.curso=form.elements.curso.value||null;
    }

    const result=await supabaseClient
      .from("profiles")
      .update(changes)
      .eq("id",state.user.id);

    if(result.error)throw result.error;

    if(password){
      const passwordResult=await supabaseClient.auth
        .updateUser({password});

      if(passwordResult.error)throw passwordResult.error;
    }

    await loadProfile(state.user);
    closeModal();
    renderApp();
    showToast("Perfil atualizado com sucesso.");
  }catch(error){
    console.error("Erro ao salvar perfil:",error);
    message.textContent=authError(error);
  }finally{
    button.disabled=false;
  }
}

document.addEventListener("click",async event=>{
  const button=event.target.closest(
    '[data-action="leave-project"],' +
    '[data-action="remove-project-member"]'
  );

  if(!button || button.disabled)return;

  const projectId=button.dataset.project;
  const leaving=button.dataset.action==="leave-project";
  const userId=leaving
    ?state.user?.id
    :button.dataset.user;

  if(!projectId || !userId)return;

  const name=leaving
    ?""
    :button.closest(".project-person")
      ?.querySelector("strong")
      ?.textContent?.trim()||"este participante";

  const confirmed=window.confirm(
    leaving
      ?"Deseja sair deste projeto? Você deixará de ser colaborador e poderá pedir para participar novamente depois."
      :`Deseja remover ${name} deste projeto? Essa pessoa deixará de ser colaboradora e poderá pedir para participar novamente depois.`
  );

  if(!confirmed)return;

  button.disabled=true;

  try{
    const result=await supabaseClient.rpc(
      "techna_sair_ou_remover_participante",
      {
        p_project_id:projectId,
        p_user_id:userId
      }
    );

    if(result.error){
      showToast(authError(result.error));
      return;
    }

    showToast(
      leaving
        ?"Você saiu do projeto."
        :"Participante removido do projeto."
    );

    await openProject(projectId);
  }catch(error){
    console.error("Erro ao sair ou remover participante:",error);
    showToast("Não foi possível concluir a ação.");
  }finally{
    button.disabled=false;
  }
});
let inviteSearchTimer;
let inviteSearchVersion=0;

document.addEventListener("click",async event=>{
    const openButton=event.target.closest(
    '[data-action="invite-project-member"], [data-action="invite-project-advisor"]'
  );

  if(openButton){
    const isAdvisorInvite=
      openButton.dataset.action==="invite-project-advisor";
    const projectId=openButton.dataset.project;
    const project=state.projects.find(
      p=>String(p.id)===String(projectId)
    );

    if(
      !state.user ||
      !project ||
      String(project.autora_id)!==String(state.user.id)
    )return;

        openModal(
      isAdvisorInvite ? "Escolher orientador" : "Convidar pessoas",
      `
      <div class="project-section"
           id="invite-project-panel"
           data-project="${esc(projectId)}"
           data-invite-type="${isAdvisorInvite ? "orientador" : "participante"}">
        <p class="muted">
          Pesquise pelo nome. Você pode selecionar mais de
          uma pessoa antes de enviar os convites.
        </p>

        <div class="field">
          <label for="invite-person-search">
            Pessoas convidadas
          </label>

          <div id="invite-selected-people"
               style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
          </div>

          <input
            id="invite-person-search"
            class="input"
            type="search"
            autocomplete="off"
            placeholder="Digite pelo menos 2 letras">
        </div>

        <div id="invite-person-results"
             aria-live="polite"></div>

        <div class="project-actions">
          <button
            class="btn btn-ghost"
            type="button"
            data-action="invite-back-project">
            Voltar ao projeto
          </button>

          <button
            class="btn btn-primary"
            type="button"
            data-action="send-project-invite"
            disabled>
            Enviar convites
          </button>
        </div>
      </div>
    `);

    return;
  }

  const backButton=event.target.closest(
    '[data-action="invite-back-project"]'
  );

  if(backButton){
    const panel=backButton.closest("#invite-project-panel");
    if(panel)await openProject(panel.dataset.project);
    return;
  }

  const personButton=event.target.closest(
    '[data-action="select-invite-person"]'
  );

  if(personButton){
    const panel=personButton.closest("#invite-project-panel");
    if(!panel)return;

    const selected=panel.querySelector(
      "#invite-selected-people"
    );
    const userId=personButton.dataset.user;
    const name=personButton.dataset.name;

    const alreadySelected=[...selected.children].some(
      chip=>chip.dataset.user===userId
    );

    if(!alreadySelected){
            const photo=personButton.dataset.photo||"";

      selected.insertAdjacentHTML("beforeend",`
        <span
          data-user="${esc(userId)}"
          data-name="${esc(name)}"
          style="display:inline-flex;align-items:center;gap:6px;
                 padding:5px 9px;border:1px solid currentColor;
                 border-radius:999px;">
          ${
            photo
              ? `<img
                   src="${esc(photo)}"
                   alt=""
                   style="width:26px;height:26px;border-radius:50%;
                          object-fit:cover;flex-shrink:0;">`
              : ""
          }
          <span>${esc(name)}</span>
          <button
            type="button"
            data-action="remove-invite-person"
            aria-label="Remover ${esc(name)} da seleção"
            style="border:0;background:none;color:inherit;
                   cursor:pointer;font-size:18px;line-height:1;">
            ×
          </button>
        </span>
      `);
    }

    panel.querySelector(
      '[data-action="send-project-invite"]'
    ).disabled=false;

    const input=panel.querySelector(
      "#invite-person-search"
    );

    input.value="";
    panel.querySelector(
      "#invite-person-results"
    ).innerHTML="";

    clearTimeout(inviteSearchTimer);
    inviteSearchVersion++;
    input.focus();
    return;
  }

  const removeButton=event.target.closest(
    '[data-action="remove-invite-person"]'
  );

  if(removeButton){
    const panel=removeButton.closest("#invite-project-panel");
    if(!panel)return;

    removeButton.parentElement.remove();

    panel.querySelector(
      '[data-action="send-project-invite"]'
    ).disabled=!panel.querySelector(
      "#invite-selected-people"
    ).children.length;

    panel.querySelector("#invite-person-search").focus();
    return;
  }

  const sendButton=event.target.closest(
    '[data-action="send-project-invite"]'
  );

  if(!sendButton || sendButton.disabled)return;

  const panel=sendButton.closest("#invite-project-panel");
  if(!panel)return;

  const projectId=panel.dataset.project;
  const project=state.projects.find(
    p=>String(p.id)===String(projectId)
  );

  if(
    !state.user ||
    !project ||
    String(project.autora_id)!==String(state.user.id)
  )return;

  const people=[
    ...panel.querySelector("#invite-selected-people").children
  ].map(chip=>({
    id:chip.dataset.user,
    name:chip.dataset.name
  }));

  if(!people.length)return;

  const names=people.map(person=>person.name).join(", ");

    const inviteType=panel.dataset.inviteType;

  if(!["participante","orientador"].includes(inviteType)){
    showToast("Tipo de convite inválido.");
    return;
  }

  if(!window.confirm(
    inviteType==="orientador"
      ?`Convidar ${names} para orientar este projeto?`
      :`Enviar convite de participação para: ${names}?`
  ))return;

  sendButton.disabled=true;

  let sent=0;
  const failures=[];

  try{
    for(const person of people){
      const {error}=await supabaseClient
        .from("project_invitations")
        .insert({
          project_id:projectId,
          invited_user_id:person.id,
          invited_by:state.user.id,
                    invitation_type:inviteType,
          status:"pendente"
        });

      if(error){
        console.error(
          `Erro ao convidar ${person.name}:`,
          error
        );

        failures.push(
          error.code==="23505"
            ?`${person.name}: já existe um convite neste projeto.`
            :`${person.name}: ${authError(error)}`
        );
      }else{
        sent++;
        const chip=[
          ...panel.querySelector(
            "#invite-selected-people"
          ).children
        ].find(
          item=>item.dataset.user===person.id
        );

        chip?.remove();
      }
    }

    if(failures.length){
      showToast(
        `${sent} convite(s) enviado(s). ` +
        failures.join(" ")
      );

      sendButton.disabled=!panel.querySelector(
        "#invite-selected-people"
      ).children.length;

      return;
    }

    showToast(
      sent===1
        ?"Convite enviado."
        :`${sent} convites enviados.`
    );

    await openProject(projectId);
  }catch(error){
    console.error("Erro ao enviar convites:",error);
    showToast("Não foi possível concluir o envio.");
    sendButton.disabled=false;
  }
});

document.addEventListener("input",event=>{
  const input=event.target;

  if(input.id!=="invite-person-search")return;

  const panel=input.closest("#invite-project-panel");
  if(!panel)return;

  const results=panel.querySelector(
    "#invite-person-results"
  );

  clearTimeout(inviteSearchTimer);
  const version=++inviteSearchVersion;

  const query=input.value
    .trim()
    .replace(/[%_\\]/g,"")
    .slice(0,60);

  if(query.length<2){
    results.innerHTML=`
      <p class="muted">Digite pelo menos 2 letras.</p>
    `;
    return;
  }

  results.innerHTML=`
    <p class="muted">Pesquisando...</p>
  `;

  inviteSearchTimer=setTimeout(async()=>{
    try{
            let peopleQuery=supabaseClient
        .from("profiles")
        .select("id,nome,username,foto_url")
        .ilike("nome",`${query}%`)
        .neq("id",state.user.id);

      if(panel.dataset.inviteType==="orientador"){
        peopleQuery=peopleQuery
          .eq("tipo_usuario","professor")
          .eq("status","publicado");
      }

      const {data,error}=await peopleQuery
        .order("nome",{ascending:true})
        .limit(8);

      if(
        version!==inviteSearchVersion ||
        !input.isConnected
      )return;

      if(error){
        console.error("Erro ao pesquisar pessoas:",error);
        results.innerHTML=`
          <p class="muted">
            Não foi possível pesquisar pessoas.
          </p>
        `;
        return;
      }

      const selectedIds=new Set(
        [...panel.querySelector(
          "#invite-selected-people"
        ).children].map(chip=>chip.dataset.user)
      );

      const available=(data||[]).filter(
        person=>!selectedIds.has(String(person.id))
      );

      results.innerHTML=available.length
        ?available.map(person=>{
          const name=person.nome||
                     person.username||
                     "Usuário";

          return `
            <button
              type="button"
              class="project-person"
              data-action="select-invite-person"
              data-user="${esc(person.id)}"
              data-name="${esc(name)}"
data-photo="${esc(person.foto_url||"")}">
              <span class="project-person-avatar">
                ${
                  person.foto_url
                    ? `<img
                         src="${esc(person.foto_url)}"
                         alt="Foto de ${esc(name)}">`
                    : esc(initials(name))
                }
              </span>
              <span>
                <strong>${esc(name)}</strong>
                <small>
                  ${esc(person.username||"")}
                </small>
              </span>
            </button>
          `;
        }).join("")
        :`<p class="muted">
            Nenhuma outra pessoa encontrada.
          </p>`;
    }catch(error){
      if(
        version!==inviteSearchVersion ||
        !input.isConnected
      )return;

      console.error("Erro ao pesquisar pessoas:",error);
      results.innerHTML=`
        <p class="muted">
          Não foi possível pesquisar pessoas.
        </p>
      `;
    }
  },300);
});
function showConfirmation({
  title,
  message,
  confirmText="OK"
}){
  return new Promise(resolve=>{
    const dialog=document.createElement("dialog");
    dialog.className="confirm-dialog";

    const heading=document.createElement("h2");
    heading.textContent=title;
    heading.id="confirm-dialog-title";

    const description=document.createElement("p");
    description.textContent=message;
    description.id="confirm-dialog-description";

    dialog.setAttribute("aria-labelledby",heading.id);
    dialog.setAttribute("aria-describedby",description.id);

    const actions=document.createElement("div");
    actions.className="confirm-dialog-actions";

    const cancelButton=document.createElement("button");
    cancelButton.type="button";
    cancelButton.textContent="Cancelar";

    const confirmButton=document.createElement("button");
    confirmButton.type="button";
    confirmButton.className="confirm-dialog-yes";
    confirmButton.textContent=confirmText;

    actions.append(cancelButton,confirmButton);
    dialog.append(heading,description,actions);
    document.body.append(dialog);

    dialog.addEventListener("cancel",event=>{
      event.preventDefault();
    });

    cancelButton.addEventListener("click",()=>{
      dialog.close();
      dialog.remove();
      resolve(false);
    });

    confirmButton.addEventListener("click",()=>{
      dialog.close();
      dialog.remove();
      resolve(true);
    });

    dialog.showModal();
    cancelButton.focus();
  });
}

async function abrirColaboradoresDoDashboard(){
  const meusProjetos=state.projects.filter(
    project=>
      String(project.autora_id)===String(state.user?.id)
  );

  if(!meusProjetos.length){
    openModal(
      "Colaboram comigo",
      `<p class="empty">
         Você ainda não tem projetos com colaboradores.
       </p>`
    );
    return;
  }

  const membrosResult=await supabaseClient
    .from("project_members")
    .select("project_id,user_id,funcao")
    .in(
      "project_id",
      meusProjetos.map(project=>project.id)
    );

  if(membrosResult.error){
    console.error(
      "Erro ao carregar colaboradores:",
      membrosResult.error
    );
    showToast("Não foi possível carregar os colaboradores.");
    return;
  }

  const projetosPorId=new Map(
    meusProjetos.map(project=>[
      String(project.id),
      project
    ])
  );

  const vistos=new Set();

  const colaboradores=(membrosResult.data||[])
    .filter(membro=>{
      if(
        !membro.user_id ||
        String(membro.user_id)===String(state.user.id) ||
        !projetosPorId.has(String(membro.project_id))
      )return false;

      const chave=
        `${String(membro.project_id)}:${String(membro.user_id)}`;

      if(vistos.has(chave))return false;

      vistos.add(chave);
      return true;
    });

  const usuariosIds=[
    ...new Set(
      colaboradores.map(membro=>membro.user_id)
    )
  ];

  const perfisResult=usuariosIds.length
    ?await supabaseClient
      .from("profiles")
      .select("id,nome,username,foto_url")
      .in("id",usuariosIds)
    :{data:[],error:null};

  if(perfisResult.error){
    console.error(
      "Erro ao carregar perfis dos colaboradores:",
      perfisResult.error
    );
    showToast(
      "Não foi possível carregar os nomes dos colaboradores."
    );
    return;
  }

  const perfisPorId=new Map(
    (perfisResult.data||[]).map(perfil=>[
      String(perfil.id),
      perfil
    ])
  );

  const membrosPorProjeto=new Map();

  for(const membro of colaboradores){
    const projectId=String(membro.project_id);

    if(!membrosPorProjeto.has(projectId)){
      membrosPorProjeto.set(projectId,[]);
    }

    membrosPorProjeto.get(projectId).push(membro);
  }

  const projetosComColaboradores=meusProjetos.filter(
    projeto=>membrosPorProjeto.has(String(projeto.id))
  );

  openModal("Colaboram comigo",`
    <div class="participation-card-grid">
      ${
        projetosComColaboradores.length
          ?projetosComColaboradores.map(projeto=>{
            const membrosDoProjeto=
              membrosPorProjeto.get(String(projeto.id));

            return `
              <article class="participation-request">
                <div class="participation-request-info">
                  <p>
                    Estão colaborando com você neste projeto:
                  </p>
                  <div
                    style="display:flex;
                           flex-wrap:wrap;
                           gap:12px;
                           align-items:center;
                           margin-bottom:12px;">
                    ${
                      membrosDoProjeto.map(membro=>{
                        const perfil=perfisPorId.get(
                          String(membro.user_id)
                        );
                        const nome=perfil?.nome||
                                   perfil?.username||
                                   "Colaborador";

                        return `
                          <span
                            title="${esc(nome)}"
                            aria-label="${esc(nome)}"
                            style="display:inline-grid;
                                   flex:0 0 48px;
                                   width:48px;
                                   height:48px;
                                   place-items:center;
                                   overflow:hidden;
                                   border-radius:50%;
                                   background:var(--p);">
                            ${
                              perfil?.foto_url
                                ?`<img
                                    src="${esc(perfil.foto_url)}"
                                    alt="${esc(nome)}"
                                    title="${esc(nome)}"
                                    style="display:block;
                                           width:100%;
                                           height:100%;
                                           object-fit:cover;">`
                                :`<span title="${esc(nome)}">
                                    ${esc(initials(nome))}
                                  </span>`
                            }
                          </span>
                        `;
                      }).join("")
                    }
                  </div>

                  ${resumoProjetoParticipacao(projeto)}
                </div>

                <div class="participation-request-actions">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-action="abrir-projeto-colaborador"
                    data-project="${esc(projeto.id)}">
                    Abrir projeto
                  </button>

                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-action="edit-project"
                    data-project="${esc(projeto.id)}">
                    Editar projeto
                  </button>
                </div>
              </article>
            `;
          }).join("")
          :`<p class="empty">
              Ninguém está colaborando nos seus projetos ainda.
            </p>`
      }
    </div>
  `);
}

    const image=editingProjectAlbum.images[
      Number(coverButton.dataset.albumCover)
    ];

    if(image && !image.removed){
      editingProjectAlbum.coverUrl=image.url;
      renderProjectAlbumEditor();

    return;

    const image=editingProjectAlbum.images[
      Number(removeButton.dataset.albumRemove)

        title:"Remover foto?",

          : "Tem certeza que deseja descartar esta foto que ainda não foi salva?",
        confirmText:"Remover"
      });

      if(!confirmed)return;

      image.removed=true;

      if(editingProjectAlbum.coverUrl===image.url){

}

if(n==="dashboard-projetos-concluidos"){

document.head.appendChild(technaBellStyle);

const technaBellSvg=`
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18
             c0-2-3-2-3-9"></path>
    <path d="M10 21h4"></path>
  </svg>
  <span class="techna-bell-count" hidden></span>
`;

let technaNotificationMenu=null;
function technaCancelBellHoverClose(){
  clearTimeout(technaBellHoverTimer);
  technaBellHoverTimer=null;
}

function technaScheduleBellHoverClose(){
  technaCancelBellHoverClose();

  technaBellHoverTimer=setTimeout(()=>{
    technaCloseNotifications();
  },220);
}

function technaPrepareBell(){
  const button=document.querySelector(
    '[data-action="notifications"]'
  );

  if(!button)return null;

  if(!button.classList.contains("techna-bell-button")){
    button.classList.add("techna-bell-button");
    button.innerHTML=technaBellSvg;
    button.setAttribute("title","Notificações");
    button.setAttribute("aria-label","Abrir notificações");
    button.setAttribute("aria-expanded","false");
  }
  
  return button;
}

async function technaRefreshBell(){
  const button=technaPrepareBell();
  const userId=state.user?.id;

  if(!button||!userId)return;

  const result=await supabaseClient
    .from("notifications")
    .select("id",{count:"exact",head:true})
    .eq("user_id",userId)
    .eq("lida",false);

  if(result.error){
    console.error(
      "Erro ao contar notificações:",
      result.error
    );
    return;
  }

  if(state.user?.id!==userId)return;

  const currentButton=technaPrepareBell();
  const badge=currentButton?.querySelector(
    ".techna-bell-count"
  );

  if(!badge)return;

  const count=result.count||0;
  badge.hidden=count===0;
  badge.textContent=count>99?"99+":String(count);

  currentButton.setAttribute(
    "aria-label",
    count
      ?`${count} notificações não lidas`
      :"Abrir notificações"
  );
}

function technaCloseNotifications(){
  if(technaNotificationMenu){
    technaNotificationMenu.remove();
    technaNotificationMenu=null;
  }

  document
    .querySelector('[data-action="notifications"]')
    ?.setAttribute("aria-expanded","false");
}

async function technaToggleNotifications(){
  if(technaNotificationMenu){
    technaCloseNotifications();
    return;
  }

  const button=technaPrepareBell();
  const userId=state.user?.id;

  if(!button||!userId)return;

  const menu=document.createElement("div");
  menu.className="techna-notification-menu";
  menu.innerHTML=`
    <h3>Notificações</h3>
    <p class="techna-notification-empty">
      Carregando notificações...
    </p>
  `;

  document.body.appendChild(menu);
technaNotificationMenu=menu;
button.setAttribute("aria-expanded","true");

menu.style.top=`${
  document.querySelector(".techna-header")
    ?.getBoundingClientRect().bottom ?? 76
}px`;

const result=await supabaseClient
    .from("notifications")
    .select(
  "id,titulo,mensagem,lida,created_at,tipo,entity_type,entity_id"
)
    .eq("user_id",userId)
    .order("created_at",{ascending:false})
    .limit(50);

  if(!menu.isConnected||state.user?.id!==userId)return;

  if(result.error){
    console.error(
      "Erro ao carregar notificações:",
      result.error
    );

    menu.innerHTML=`
      <h3>Notificações</h3>
      <p class="techna-notification-empty">
        Não foi possível carregar as notificações.
      </p>
    `;
    return;
  }

    const notifications=result.data||[];

  menu.innerHTML=`
    <h3>Notificações</h3>
    ${
      notifications.length
        ?notifications.map(item=>`
          <div class="techna-notification-item ${item.lida?"":"is-unread"}"
               data-notification-id="${esc(item.id)}">
            <strong>
              ${esc(item.titulo||"Notificação")}
            </strong>
            <span>
              ${esc(item.mensagem||"")}
            </span>
            <small>
              ${new Date(item.created_at)
                .toLocaleString("pt-BR")}
            </small>
          </div>
        `).join("")
        :`<p class="techna-notification-empty">
            Você ainda não tem notificações.
          </p>`
    }
  `;

  menu.addEventListener("click",async event=>{
    const element=event.target.closest(".techna-notification-item");
    if(!element)return;

    const item=notifications.find(
      notification=>String(notification.id)===
        element.dataset.notificationId
    );
    if(!item)return;

    if(event.detail>=2){
      if(item.entity_type==="project" && item.entity_id){
        technaCloseNotifications();
        await openProject(item.entity_id);
      }
      return;
    }

    if(item.lida)return;

    const update=await supabaseClient
      .from("notifications")
      .update({lida:true})
      .eq("user_id",userId)
      .eq("id",item.id);

    if(update.error){
      console.error("Erro ao marcar notificação como lida:",update.error);
      return;
    }

    item.lida=true;
    element.classList.remove("is-unread");
    await technaRefreshBell();
  });
}
/* Impede a mensagem fixa do botão antigo. */
document.addEventListener("click",event=>{
  const bell=event.target.closest(
    '[data-action="notifications"]'
  );

  if(bell){
    event.preventDefault();
    event.stopImmediatePropagation();
    technaToggleNotifications();
    return;
  }

  if(
    technaNotificationMenu &&
    !event.target.closest(".techna-notification-menu")
  ){
    technaCloseNotifications();
  }
},true);

/* O site recria o cabeçalho em renderApp().
   Prepara o sino imediatamente após cada reconstrução. */
const technaOriginalRenderApp=renderApp;

renderApp=function(...args){
  technaCloseNotifications();

  const result=technaOriginalRenderApp.apply(this,args);

  technaPrepareBell();
  technaRefreshBell();

  return result;
};

technaPrepareBell();
technaRefreshBell();
setInterval(technaRefreshBell,15000);
let technaPendingCountRefreshing=false;

async function technaRefreshPendingRequestsCount(){
  if(technaPendingCountRefreshing || !state.user)return;

  const userId=state.user.id;
  const meusProjetos=state.projects.filter(
    project=>String(project.autora_id)===String(userId)
  );

  technaPendingCountRefreshing=true;

  try{
    let total=0;

    if(meusProjetos.length){
      const result=await supabaseClient
        .from("project_participation_requests")
        .select("id,project_id")
        .eq("status","pendente")
        .in(
          "project_id",
          meusProjetos.map(project=>project.id)
        );

      if(result.error){
        console.error(
          "Erro ao atualizar número de pedidos:",
          result.error
        );
        return;
      }

      total=(result.data||[]).length;
    }

    if(state.user?.id!==userId)return;

    const counter=document.querySelector(
      '[data-action="dashboard-pedidos"] b'
    );

    if(counter){
      counter.textContent=String(total);
    }
  }catch(error){
    console.error(
      "Falha inesperada ao atualizar pedidos:",
      error
    );
  }finally{
    technaPendingCountRefreshing=false;
  }
}
setInterval(technaRefreshPendingRequestsCount,3000);

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    technaRefreshPendingRequestsCount();
  }
});
document.addEventListener("click",async event=>{
  const button=event.target.closest(
    '[data-action="decide-professor-profile"]'
  );

  if(!button || button.disabled)return;
  if(state.profile?.tipo_usuario!=="administradora")return;

  const userId=button.dataset.userId;
  const decision=button.dataset.decision;
  const name=button.dataset.userName||"este usuário";

  if(!userId || !["aprovar","recusar"].includes(decision)){
    return;
  }

  const confirmed=await showConfirmation({
    title:decision==="aprovar"
      ?"Aprovar perfil de professor?"
      :"Recusar perfil de professor?",
    message:decision==="aprovar"
      ?`Conceder o perfil de professor a ${name}?`
      :`Recusar o pedido de ${name}? A pessoa poderá solicitar novamente.`,
    confirmText:decision==="aprovar"
      ?"Aprovar"
      :"Recusar"
  });

  if(!confirmed)return;

  const buttons=[
    ...document.querySelectorAll(
      '[data-action="decide-professor-profile"]'
    )
  ];

  buttons.forEach(item=>item.disabled=true);

  try{
    const result=await supabaseClient.rpc(
      "decidir_perfil_professor",
      {
        p_usuario_id:userId,
        p_decisao:decision
      }
    );

    if(result.error)throw result.error;

    showToast(
      decision==="aprovar"
        ?"Perfil de professor aprovado."
        :"Pedido recusado. A pessoa poderá solicitar novamente."
    );

    await adminPage();
  }catch(error){
    console.error(
      "Erro ao decidir perfil de professor:",
      error
    );
    showToast(authError(error));
    buttons.forEach(item=>item.disabled=false);
  }
});
document.addEventListener("click",async event=>{
  const button=event.target.closest(
    '[data-action="open-teacher-profile"]'
  );

  if(!button)return;

  const teacherId=button.dataset.teacherId;
  if(!teacherId)return;

  button.disabled=true;

  try{
    const result=await supabaseClient
      .from("profiles")
      .select("id,nome,foto_url,instituicao,biografia,areas_atuacao")
      .eq("id",teacherId)
      .eq("tipo_usuario","professor")
      .eq("status","publicado")
      .maybeSingle();

    if(result.error)throw result.error;

    const professor=result.data;

    if(!professor){
      showToast("Perfil de professor não encontrado.");
      return;
    }

    const projetosCriados=state.projects.filter(
      project=>String(project.autora_id)===String(teacherId)
    );

    const orientacoesResult=await supabaseClient
      .from("project_members")
      .select("project_id,funcao")
      .eq("user_id",teacherId)
      .ilike("funcao","orientador");

    if(orientacoesResult.error)throw orientacoesResult.error;

    const idsOrientados=new Set(
      (orientacoesResult.data||[]).map(
        item=>String(item.project_id)
      )
    );

    const projetosOrientados=state.projects.filter(
      project=>idsOrientados.has(String(project.id))
    );
    
    openModal(esc(professor.nome),`
      <div class="profile-head">
        ${avatar(professor,true)}
        <div>
          <h2>${esc(professor.nome)}</h2>
          <p class="muted">
            ${esc(
              professor.instituicao||
              "Instituição não informada"
            )}
          </p>
        </div>
      </div>
<section class="project-section">
  <h3>Áreas de preferência</h3>
  <p>${esc(
    professor.areas_atuacao||
    "Áreas ainda não informadas."
  )}</p>
</section>
      <section class="project-section">
        <h3>Sobre o professor</h3>
        <p>${esc(
          professor.biografia||
          "Biografia ainda não informada."
        )}</p>
      </section>

      <section class="project-section">
        <h3>Projetos criados</h3>
        ${
          projetosCriados.length
            ?`<div class="project-grid">
                ${projetosCriados.map(
                  project=>projectCard(project,false)
                ).join("")}
              </div>`
            :`<p class="muted">
                Nenhum projeto criado até o momento.
               </p>`
        }
      </section>

      <section class="project-section">
        <h3>Projetos orientados</h3>
        ${
          projetosOrientados.length
            ?`<div class="project-grid">
                ${projetosOrientados.map(
                  project=>projectCard(project,false)
                ).join("")}
              </div>`
            :`<p class="muted">
                Nenhum projeto orientado para exibir no momento.
              </p>`
        }
      </section>
    `);
  }catch(error){
    console.error(
      "Erro ao abrir perfil de professor:",
      error
    );
    showToast("Não foi possível abrir o perfil.");
  }finally{
    button.disabled=false;
  }
});
</script>
<script>
(() => {
  let pedidoInstalacao = null;

  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    pedidoInstalacao = event;
  });

  window.addEventListener("appinstalled", () => {
    pedidoInstalacao = null;
  });

  document.addEventListener("click", async event => {
    const botao = event.target.closest('[data-action="install-app"]');
    if (!botao) return;

    event.preventDefault();

    const instalado =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (instalado) {
      alert("O TECHNA já está instalado neste celular.");
      return;
    }

    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (ios) {
      alert(
        "Para instalar o TECHNA no iPhone: abra este site no Safari, " +
        "toque em Compartilhar, escolha Adicionar à Tela de Início, " +
        "ative Abrir como App e toque em Adicionar."
      );
      return;
    }

    if (pedidoInstalacao) {
      const pedido = pedidoInstalacao;
      pedidoInstalacao = null;
      await pedido.prompt();
      return;
    }

    alert(
      "Abra o menu do navegador e escolha Instalar app ou " +
      "Adicionar à tela inicial. Se o TECHNA já estiver instalado, " +
      "essa opção pode não aparecer."
    );
  });
})();
