<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tecna</title>
<style>
:root{--purple:#4d1263;--purple-2:#722a80;--lime:#a8d719;--bg:#faf8fb;--ink:#241b29;--muted:#766b7d;--line:#e9e1eb}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.art{display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;padding:7vw;color:#fff;background:linear-gradient(145deg,#321047,#722a80 65%,#9b70a4)}.art h1{max-width:620px;margin:auto 0 15px;font-size:clamp(3rem,7vw,6.2rem);line-height:.92;letter-spacing:-.08em}.art p{max-width:500px;color:#f4eaf6;line-height:1.7}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-mark{display:grid;width:42px;height:42px;place-items:center;color:var(--lime);border-radius:13px;background:#ffffff22;font-size:22px}.brand-name{font-size:1.4rem}.panel{display:grid;place-items:center;padding:40px 8%}.auth{width:min(100%,440px)}.auth h2{margin:12px 0;color:#35103f;font-size:clamp(2rem,4vw,3rem)}.muted{color:var(--muted)}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;font-weight:800}.input,.select{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 16px;border:0;border-radius:11px;font-weight:800}.primary{color:#263000;background:var(--lime)}.secondary{color:var(--purple);background:#f1e8f3;border:1px solid #dfcde3}.full{width:100%}.message{min-height:20px;color:#b3261e;font-size:.85rem}.message.ok{color:#5f8200}.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:.82rem}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.social{display:grid;grid-template-columns:1fr 1fr;gap:10px}.social button{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800}.modal-bg{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:18px;background:#32104799}.modal{width:min(100%,680px);padding:24px;border-radius:20px;background:#fff}.modal-head{display:flex;justify-content:space-between}.modal-head h2{margin:0;color:var(--purple)}.close{border:1px solid var(--line);border-radius:8px;background:#fff;font-size:1.3rem}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.role{padding:13px;text-align:left;border:1px solid var(--line);border-radius:11px;background:#fff}.role.selected{border-color:#8daa00;background:#edf8c5}.role strong,.role small{display:block}.role small{margin-top:4px;color:var(--muted)}.availability{display:block;margin-top:5px;font-size:.78rem;color:var(--muted)}@media(max-width:780px){.login{display:block}.art{min-height:390px;padding:28px}.panel{min-height:650px;padding:40px 23px}}@media(max-width:520px){.social,.role-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="sb_publishable_t2nSHz0OetO50wFuSGct6A_tiRt3Fu-";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkdGdlYnphZndrb3VuaXBmdnJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjMzMDksImV4cCI6MjEwNTY5OTMwOX0.Yru3KnKz4ErCwdMYfi90UJdhkbXIAjbDAMPHG_kr0qQ";
const isConfigured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("COLE_A_")&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes("COLE_A_");
const supabaseClient=isConfigured&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const root=document.getElementById("root"),modalRoot=document.getElementById("modalRoot");
function renderLogin(){root.innerHTML=`<main class="login"><section class="art"><div class="brand"><span class="brand-mark">✦</span><span class="brand-name">Tecna</span></div><div><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p></div><small>Comunidade educacional Tecna.</small></section><section class="panel"><div class="auth"><p class="muted">Acesso à plataforma</p><h2>Bem-vindo ao Tecna</h2><p class="muted">Entre para acompanhar e compartilhar projetos.</p><form id="loginForm"><div class="field"><label>E-mail ou username</label><input class="input" name="identifier" required></div><div class="field"><label>Senha</label><input class="input" name="password" type="password" minlength="6" required></div><p id="loginMessage" class="message"></p><button type="submit" class="btn primary full">Entrar</button></form><div class="divider">ou continue com</div><div class="social"><button type="button" data-oauth="google">Google</button><button type="button" data-oauth="facebook">Facebook</button></div><p class="muted" style="text-align:center;margin-top:22px">Ainda não tem uma conta? <button type="button" class="btn secondary" data-action="register">Criar conta</button></p></div></section></main>`}
function modal(title,body){modalRoot.innerHTML=`<div class="modal-bg" data-close><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" data-close>×</button></div>${body}</div></div>`}
function closeModal(){modalRoot.innerHTML=""}
function registerModal(){modal("Criar conta",`<form id="registerForm"><div class="field"><label>Nome completo</label><input class="input" name="nome" required></div><div class="field"><label>Username</label><input class="input" name="username" id="registerUsername" pattern="[A-Za-z0-9_]+" required><span class="availability" id="usernameState">Digite para receber sugestões.</span></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" minlength="6" required></div><div class="role-grid"><button type="button" class="role selected" data-role="aluno"><strong>Aluno</strong><small>Cria e participa de projetos</small></button><button type="button" class="role" data-role="professor"><strong>Professor</strong><small>Orienta projetos</small></button></div><input type="hidden" name="tipo" value="aluno"><div class="field" id="courseField"><label>Curso</label><select class="select" name="curso"><option>Marketing</option><option>Administração</option><option>Informática</option><option>Informática para Internet</option></select></div><p id="registerMessage" class="message"></p><button type="submit" class="btn primary full">Criar conta</button></form>`);document.querySelectorAll("[data-role]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-role]").forEach(x=>x.classList.remove("selected"));button.classList.add("selected");document.querySelector('[name="tipo"]').value=button.dataset.role;document.getElementById("courseField").style.display=button.dataset.role==="aluno"?"block":"none"});document.getElementById("registerUsername").addEventListener("input",checkUsername)}
async function checkUsername(){const input=document.getElementById("registerUsername"),state=document.getElementById("usernameState");if(!input||!state)return;input.value=input.value.toLowerCase().replace(/[^a-z0-9_]/g,"");if(input.value.length<3){state.textContent="Use pelo menos 3 caracteres.";return}const suggestions=[input.value+"01",input.value+"_tecna",input.value+new Date().getFullYear()];if(!supabaseClient){state.textContent="Sugestões: "+suggestions.join(" · ");return}const result=await supabaseClient.from("profiles").select("id").ilike("username",input.value).maybeSingle();state.textContent=result.data?"Username ocupado. Sugestões: "+suggestions.join(" · "):"Username disponível. Sugestões: "+suggestions.join(" · ")}
/* Corrige exclusivamente o erro original de acesso aos campos do cadastro. */
async function register(event){event.preventDefault();const form=event.currentTarget;const message=document.getElementById("registerMessage");const button=form.querySelector('button[type="submit"]');const nome=form.elements.namedItem("nome")?.value?.trim();const username=form.elements.namedItem("username")?.value?.trim().toLowerCase();const email=form.elements.namedItem("email")?.value?.trim().toLowerCase();const password=form.elements.namedItem("password")?.value;const tipo=form.elements.namedItem("tipo")?.value;const curso=form.elements.namedItem("curso")?.value||null;if(!nome){message.textContent="Informe seu nome completo.";return}if(!username||username.length<3){message.textContent="O username precisa ter pelo menos 3 caracteres.";return}if(!/^[a-z0-9_]+$/.test(username)){message.textContent="O username só pode conter letras, números e sublinhado.";return}if(!email||!email.includes("@")){message.textContent="Informe um e-mail válido.";return}if(!password||password.length<6){message.textContent="A senha precisa ter pelo menos 6 caracteres.";return}if(!["aluno","professor"].includes(tipo)){message.textContent="Escolha Aluno ou Professor.";return}if(tipo==="aluno"&&!curso){message.textContent="Escolha seu curso.";return}if(!supabaseClient){message.textContent="Configure o Supabase antes do cadastro.";return}if(button){button.disabled=true;button.textContent="Criando conta..."}message.textContent="";try{const result=await supabaseClient.auth.signUp({email,password,options:{data:{nome,username,tipo_solicitado:tipo,curso:tipo==="aluno"?curso:null}}});if(result.error){message.textContent=result.error.message;return}message.classList.add("ok");message.textContent=result.data?.session?"Cadastro realizado com sucesso.":"Cadastro criado. Confirme o e-mail.";if(result.data?.session)closeModal()}catch(error){console.error("[Tecna cadastro]",error);message.textContent=error?.message||"Não foi possível criar a conta."}finally{if(button){button.disabled=false;button.textContent="Criar conta"}}}
async function login(event){event.preventDefault();const form=event.currentTarget,message=document.getElementById("loginMessage");if(!supabaseClient){message.textContent="Configure o Supabase antes de entrar.";return}const identifier=form.elements.namedItem("identifier")?.value?.trim();const password=form.elements.namedItem("password")?.value;if(!identifier||!password){message.textContent="Informe os dados de acesso.";return}try{const email=identifier.includes("@")?identifier:(await supabaseClient.rpc("resolve_username",{username_input:identifier})).data?.[0]?.email;if(!email){message.textContent="E-mail ou username não encontrado.";return}const result=await supabaseClient.auth.signInWithPassword({email,password});if(result.error)throw result.error;message.className="message ok";message.textContent="Login realizado."}catch(error){message.textContent=error?.message||"Não foi possível entrar."}}
document.addEventListener("submit",event=>{if(event.target?.id==="registerForm")register(event);if(event.target?.id==="loginForm")login(event)});document.addEventListener("click",event=>{const action=event.target.closest("[data-action]"),oauth=event.target.closest("[data-oauth]");if(action&&action.dataset.action==="register")registerModal();if(oauth){if(!supabaseClient){alert("Configure o Supabase antes de usar este botão.");return}supabaseClient.auth.signInWithOAuth({provider:oauth.dataset.oauth,options:{redirectTo:location.href}})}});modalRoot.addEventListener("click",event=>{if(event.target.hasAttribute("data-close"))closeModal()});renderLogin();
</script>
</body>
</html>
