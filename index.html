<!-- TECHNA — HTML COMPLETO CORRIGIDO
Base: paste.txt estável enviado pelo usuário.
Ajuste exclusivo: a imagem do carrossel agora ocupa toda a área visual,
sem faixa lateral, usando imagem de fundo com cover e posicionamento central.
O conteúdo do projeto permanece visível ao lado.
-->

.news-carousel-shell{
  position:relative;
  overflow:hidden;
  padding:0 48px;
  border-radius:20px;
  background:#321047;
}

.news-carousel-track{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
}

.news-carousel-track::-webkit-scrollbar{
  display:none;
}

.news-carousel-slide{
  display:flex;
  flex-direction:column;
  flex:0 0 calc((100% - 12px)/2);
  min-width:0;
  min-height:370px;
  overflow:hidden;
  border-radius:16px;
  background:#321047;
  color:#fff;
  scroll-snap-align:start;
}

.news-carousel-image{
  flex:0 0 190px;
  min-height:190px;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

.news-carousel-copy{
  display:flex;
  flex:1;
  flex-direction:column;
  justify-content:flex-start;
  min-width:0;
  padding:18px;
}

.news-carousel-copy small{
  color:#e9ddef;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.news-carousel-copy h3{
  margin:9px 0;
  font-size:clamp(1.05rem,1.7vw,1.45rem);
  line-height:1.3;
}

.news-carousel-copy p{
  display:-webkit-box;
  overflow:hidden;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  color:#f2e8f4;
  line-height:1.5;
}

.news-carousel-copy .btn{
  margin-top:auto;
}

.news-carousel-arrow{
  position:absolute;
  z-index:3;
  top:50%;
  display:grid;
  width:42px;
  height:42px;
  place-items:center;
  color:var(--p);
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:0 5px 18px #16051d66;
  transform:translateY(-50%);
  font-size:1.35rem;
  font-weight:900;
  transition:.2s;
}

.news-carousel-arrow:hover{
  background:var(--lime);
  transform:translateY(-50%) scale(1.08);
}

.news-carousel-arrow.prev{left:8px}
.news-carousel-arrow.next{right:8px}

.news-carousel-dots{
  display:flex;
  justify-content:center;
  gap:7px;
  padding:10px 0 13px;
  background:#321047;
}

.news-carousel-dot{
  width:8px;
  height:8px;
  padding:0;
  border:0;
  border-radius:50%;
  background:#d9c5dd;
  transition:.2s;
}

.news-carousel-dot.active{
  width:25px;
  border-radius:99px;
  background:var(--lime);
}

@media(max-width:820px){
  .news-carousel-slide{
    flex-basis:100%;
  }

  .news-carousel-image{
    flex-basis:220px;
    min-height:220px;
  }
}
body:has(.login) .sidebar,body:has(.login) .layout>.sidebar{display:none!important}

/* Editar perfil: sem barra interna quando todo o conteúdo couber */
.modal:has(.profile-avatar-editor){max-height:none;overflow:hidden}
.modal-bg:has(.modal .profile-avatar-editor){overflow:hidden}

@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media(max-width:820px){.login{display:block;height:100dvh;min-height:0;overflow:hidden}.login-art{display:none}.login-panel{display:grid;place-items:center;width:100%;height:100dvh;min-height:0;padding:18px;overflow:hidden}.auth{width:min(100%,430px)}.auth h2{font-size:clamp(1.65rem,8vw,2.25rem)}.layout{display:block}.sidebar{position:fixed;z-index:30;left:0;top:0;width:265px;height:100dvh;transform:translateX(-105%);transition:.25s}.sidebar.open{transform:none}.menu{display:inline-grid;margin-right:8px}.news-carousel-slide{grid-template-columns:1fr}.news-carousel-image{min-height:220px}.news-carousel-copy{padding:20px}.form-grid,.role-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.modal{width:100%;max-height:calc(100dvh - 16px);padding:16px}.detail-cover{height:190px}.detail-grid{grid-template-columns:1fr;gap:14px}.modal:has(.profile-avatar-editor){width:100%;max-height:none;overflow:hidden}}
@media(max-height:700px){.login-panel{padding-top:10px;padding-bottom:10px}.auth h2{margin-top:3px;font-size:1.65rem}.auth-intro{margin-bottom:8px}.field{margin-bottom:6px}.input,.select,.textarea{padding-top:9px;padding-bottom:9px}.divider{margin:8px 0}}
@media(max-width:560px){.stats,.project-grid,.social-login{grid-template-columns:1fr}.card{padding:17px}.horizontal{grid-auto-columns:70vw}.topbar h1{font-size:1.7rem}.news-carousel-shell{padding-inline:40px}.project-cover,.project-cover img{height:210px;min-height:210px}.modal{max-height:calc(100dvh - 12px);padding:14px}.detail-cover{height:145px;margin-bottom:14px}.login-panel{padding:14px}}
.project-hero {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  align-items: center;
  gap: 18px;
}

.project-main-cover {
  display: grid;
  width: 210px;
  aspect-ratio: 1;
  place-items: center;
  overflow: hidden;
  border-radius: 15px;
  background: #f7f2f8;
}

.project-main-cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.project-summary {
  min-width: 0;
}

.project-summary h2 {
  margin: 5px 0 8px;
  color: var(--p);
}

.project-summary p {
  margin: 8px 0;
}

.project-section {
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
}

.project-section h3 {
  margin: 0 0 12px;
  color: var(--p);
}

.project-album-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.project-album-item {
  min-width: 0;
  margin: 0;
}

.project-album-item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 11px;
}

.project-album-item figcaption {
  margin-top: 4px;
  color: var(--muted);
  font-size: .76rem;
}

.project-people-list {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.project-person {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
}

.project-person-avatar {
  display: grid;
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  background: #f1e8f3;
  color: var(--p);
  font-size: .75rem;
  font-weight: 800;
}

.project-person-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.project-person strong,
.project-person small {
  display: block;
}

.project-person small {
  color: var(--muted);
  font-size: .72rem;
}

@media (max-width: 620px) {
  .project-hero {
    grid-template-columns: 105px minmax(0, 1fr);
    gap: 12px;
  }

  .project-main-cover {
    width: 105px;
  }

  .project-album-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 420px) {
  .project-hero {
    grid-template-columns: 1fr;
  }

  .project-main-cover {
    width: min(100%, 180px);
  }

  .project-album-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.album-editor {
  grid-column: 1 / -1;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #faf8fb;
}

.album-editor h3 {
  margin: 0 0 5px;
  color: var(--p);
}

.album-editor > p {
  margin: 0 0 12px;
  color: var(--muted);
}

.album-editor-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.album-editor-item {
  min-width: 0;
  padding: 7px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.album-editor-item.is-cover {
  border-color: var(--lime);
}

.album-editor-item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
}

.album-editor-item small {
  display: block;
  margin: 5px 0;
  color: var(--muted);
}

.album-editor-item button {
  width: 100%;
  min-height: 32px;
  margin-top: 5px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--p);
  font-size: .75rem;
  font-weight: 800;
}

.album-editor-item button:disabled {
  cursor: default;
  opacity: .7;
}

@media (max-width: 620px) {
  .album-editor-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
/* TECHNA: navegação superior */
.techna-layout{
  display:block;
  min-height:100dvh;
}

.techna-header{
  position:fixed;
top:0;
left:0;
right:0;
width:100%;
z-index:40;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:76px;
  padding:10px clamp(16px,3vw,48px);
  background:#fff;
  border-bottom:1px solid var(--line);
  box-shadow:0 3px 16px rgba(77,18,99,.06);
}

.techna-header .brand{
  flex:none;
  color:var(--p);
  white-space:nowrap;
}

.techna-header-nav,
.techna-header-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.techna-header-nav{
  flex:none;
}

.techna-header-nav button,
.techna-more-menu button,
.techna-profile-dropdown button{
  border:0;
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  text-align:left;
}

.techna-header-nav > button,
.techna-more-trigger{
  padding:10px 5px;

function stopCarousel(){if(carouselState.timer){clearInterval(carouselState.timer);carouselState.timer=null}}
function updateCarousel(index,behavior="smooth"){
  const root=document.querySelector("[data-news-carousel]");
  const track=root?.querySelector("[data-news-carousel-track]");
  const slides=root
    ?[...root.querySelectorAll("[data-news-slide]")]
    :[];

  if(!track||!slides.length)return;

  const count=slides.length;
  carouselState.index=(index+count)%count;

  const target=slides[carouselState.index];

  track.scrollTo({
    left:target.offsetLeft-track.offsetLeft,
    behavior
  });

  root.querySelectorAll("[data-news-carousel-dot]")
    .forEach((dot,i)=>{
      dot.classList.toggle(
        "active",
        i===carouselState.index
      );
    });
}
function startCarousel(){
  stopCarousel();

  const count=document.querySelectorAll(
    "[data-news-slide]"
  ).length;

  if(count>1){
    carouselState.timer=setInterval(()=>{
      if(!carouselState.paused){
        updateCarousel(carouselState.index+1);
      }
    },5000);
  }
}
function initCarousel(){
  stopCarousel();

  const root=document.querySelector("[data-news-carousel]");
  const track=root?.querySelector(
    "[data-news-carousel-track]"
  );

  if(!root||!track)return;

  carouselState.index=0;
  carouselState.paused=false;

  const slides=[...root.querySelectorAll(
    "[data-news-slide]"
  )];

  if(slides.length>1){
    const copies=window.innerWidth>820?2:1;

    for(let i=0;i<copies;i++){
      const clone=slides[i%slides.length].cloneNode(true);
      clone.removeAttribute("data-news-slide");
      clone.setAttribute("aria-hidden","true");
      clone.querySelectorAll("button").forEach(button=>{
        button.tabIndex=-1;
      });
      track.appendChild(clone);
    }
  }

  root.querySelector("[data-news-carousel-prev]")
    ?.addEventListener("click",()=>{
      updateCarousel(carouselState.index-1);
      startCarousel();
    });

  root.querySelector("[data-news-carousel-next]")
    ?.addEventListener("click",()=>{
      updateCarousel(carouselState.index+1);
      startCarousel();
    });

  root.querySelectorAll("[data-news-carousel-dot]")
    .forEach(dot=>{
      dot.addEventListener("click",()=>{
        updateCarousel(
          Number(dot.dataset.newsCarouselDot)
        );
        startCarousel();
      });
    });

  root.addEventListener("mouseenter",()=>{
    carouselState.paused=true;
  });

  root.addEventListener("mouseleave",()=>{
    carouselState.paused=false;
  });

  let startX=0;

  track.addEventListener("touchstart",event=>{
    startX=event.touches[0].clientX;
  },{passive:true});

  track.addEventListener("touchend",event=>{
    const delta=startX-event.changedTouches[0].clientX;

    if(Math.abs(delta)>45){
      updateCarousel(
        carouselState.index+(delta>0?1:-1)
      );
      startCarousel();
    }
  },{passive:true});

  startCarousel();
}

async function getActivities(){
  let updates=[];

  if(state.user){
    const r=await supabaseClient
      .from("project_updates")
      .select("*,profiles(nome)")
      .order("created_at",{ascending:false});

    if(r.error){
      console.error("Erro ao carregar atualizações:",r.error);
    }else{
      updates=r.data||[];
    }
  }

  const grouped={};

  updates.forEach(u=>{
    (grouped[u.project_id]??=[]).push(u);
  });

  const authorIds=[
    ...new Set(
      state.projects
        .map(p=>p.autora_id)
        .filter(Boolean)
    )
  ];

  const authorNames=new Map();

  if(authorIds.length){
    const result=await supabaseClient
      .from("profiles")
      .select("id,nome,username")
      .in("id",authorIds);

    if(result.error){
      console.error("Erro ao carregar autores:",result.error);
    }else{
      (result.data||[]).forEach(profile=>{
        authorNames.set(
          String(profile.id),
          profile.nome||profile.username||"Integrante da TECHNA"
        );
      });
    }
  }

  return state.projects
    .flatMap(project=>{
      const projetoComAutor={
        ...project,
        autor_nome:
          authorNames.get(String(project.autora_id))||
          project.autor_nome||
          "Integrante da TECHNA"
      };

      return projectActivity(
        projetoComAutor,
        grouped[project.id]||[]
      );
    })
    .sort(
      (a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)
    );
}

async function loadPendingProjectRequests(projectId){
  const container=document.getElementById(
    "project-pending-requests"
  );
  if(!container)return;

  const result=await supabaseClient
    .from("project_participation_requests")
    .select("id,requester_id,mensagem,created_at")
    .eq("project_id",projectId)
    .eq("status","pendente")
    .order("created_at",{ascending:true});

  if(!container.isConnected)return;

  if(result.error){
    console.error("Erro ao carregar solicitações:",result.error);
    container.innerHTML=
      `<p class="message">
        Não foi possível carregar as solicitações.
      </p>`;
    return;
  }

  const requests=result.data||[];

  if(!requests.length){
    container.innerHTML=
      `<p class="muted">Nenhuma solicitação pendente.</p>`;
    return;
  }

  const ids=[...new Set(
    requests.map(request=>request.requester_id)
  )];

  const profilesResult=await supabaseClient
    .from("profiles")
    .select("id,nome,username,foto_url")
    .in("id",ids);

  if(!container.isConnected)return;

  if(profilesResult.error){
    console.error(
      "Erro ao carregar solicitantes:",
      profilesResult.error
    );
    container.innerHTML=
      `<p class="message">
        Não foi possível carregar os solicitantes.
      </p>`;
    return;
  }

  const profileById=new Map(
    (profilesResult.data||[]).map(profile=>[
      String(profile.id),
      profile
    ])
  );

  container.innerHTML=requests.map(request=>{
    const profile=profileById.get(
      String(request.requester_id)
    );
    const name=profile?.nome||
               profile?.username||
               "Usuário";

    return `
      <article class="participation-request">
        <span class="project-person-avatar">
          ${
            profile?.foto_url
              ? `<img src="${esc(profile.foto_url)}"
                      alt="Foto de ${esc(name)}">`
              : esc(initials(name))
          }
        </span>

        <div class="participation-request-info">
          <strong>${esc(name)}</strong>
          ${
            request.mensagem
              ? `<p>${esc(request.mensagem)}</p>`
              : `<p class="muted">Sem mensagem.</p>`
          }
        </div>

        <div class="participation-request-actions">
          <button type="button"
                  class="btn btn-primary"
                  data-action="decide-participation"
                  data-request-id="${esc(request.id)}"
                  data-project-id="${esc(projectId)}"
                  data-decision="aceita">
            Aceitar
          </button>

          <button type="button"
                  class="btn btn-ghost"
                  data-action="decide-participation"
                  data-request-id="${esc(request.id)}"
                  data-project-id="${esc(projectId)}"
                  data-decision="recusada">
            Recusar
          </button>
        </div>
      </article>
    `;
  }).join("");
}
async function loadProjectInteractions(projectId){
  const [likes,comments,request]=await Promise.all([
    supabaseClient
      .from("project_likes")
      .select("user_id")
      .eq("project_id",projectId),

    supabaseClient
      .from("project_comments")
      .select("id,project_id,author_id,conteudo,status,created_at")
      .eq("project_id",projectId)
      .eq("status","publicado")
      .order("created_at",{ascending:false}),

    state.user
      ?supabaseClient
        .from("project_participation_requests")
        .select("*")
        .eq("project_id",projectId)
        .eq("requester_id",state.user.id)
        .maybeSingle()
      :Promise.resolve({data:null,error:null})
  ]);
  if(comments.error){
    console.error("Erro ao carregar comentários:",comments.error);
  }
  return {
    likes:likes.error?[]:(likes.data||[]),
    comments:comments.error?[]:(comments.data||[]),
    request:request.error?null:request.data
  };
}

let editingProjectAlbum=null;

async function setupProjectAlbumEditor(project){
  const response=await supabaseClient
    .from("project_images")
    .select("id,arquivo_url,ordem")
    .eq("project_id",project.id)
    .order("ordem",{ascending:true});

  const container=document.getElementById("edit-project-album");
  if(!container)return;

  if(response.error){
    container.innerHTML=
      `<p class="message">Não foi possível carregar o álbum.</p>`;
    console.error(response.error);
    return;
  }

  const saved=(response.data||[]).map(image=>({
    id:image.id,
    url:image.arquivo_url,
    file:null,
    removed:false
  }));

  if(
    project.imagem_capa_url &&
    !saved.some(image=>image.url===project.imagem_capa_url)
  ){
    saved.unshift({
      id:null,
      url:project.imagem_capa_url,
      file:null,
      removed:false
    });
  }

  editingProjectAlbum={
    projectId:String(project.id),
    images:saved,
    coverUrl:project.imagem_capa_url||saved[0]?.url||null
  };

  renderProjectAlbumEditor();

  document
    .getElementById("edit-project-images")
    ?.addEventListener("change",event=>{
      const files=[...event.target.files]
        .filter(file=>file.type.startsWith("image/"));

      for(const file of files){
        editingProjectAlbum.images.push({
          id:null,
          url:URL.createObjectURL(file),
          file,
          removed:false
        });
      }

      if(!editingProjectAlbum.coverUrl && files.length){
        editingProjectAlbum.coverUrl=
          editingProjectAlbum.images.at(-files.length).url;
      }

      event.target.value="";
      renderProjectAlbumEditor();
    });
}

function renderProjectAlbumEditor(){
  const album=editingProjectAlbum;
  const container=document.getElementById("edit-project-album");
  if(!album||!container)return;

  const visible=album.images
    .map((image,index)=>({...image,index}))
    .filter(image=>!image.removed);

  container.innerHTML=visible.length
    ?visible.map(image=>`
      <div class="album-editor-item
                  ${image.url===album.coverUrl?"is-cover":""}">
        <img src="${esc(image.url)}"
             alt="Imagem do projeto">

        <small>
          ${image.url===album.coverUrl?"Capa atual":"Foto do álbum"}
        </small>

        ${
          image.url!==album.coverUrl
            ? `<button type="button"
                       data-album-cover="${image.index}">
                 Usar como capa
               </button>`
            : ""
        }

        <button type="button"
                data-album-remove="${image.index}">
          Remover
        </button>
      </div>
    `).join("")
    :`<p class="muted">Nenhuma imagem adicionada.</p>`;
}

async function saveProjectEdit(e){
  e.preventDefault();

  const form=e.target;
  const id=form.dataset.project;
  const project=state.projects.find(
    x=>String(x.id)===String(id)
  );
  const message=document.getElementById("edit-project-message");
  const album=editingProjectAlbum;

  if(!project||!state.user||
     String(project.autora_id)!==String(state.user.id)){
    message.textContent=
      "Você não tem permissão para editar este projeto.";
    return;
  }

  if(!album||album.projectId!==String(id)){
    message.textContent=
      "O álbum ainda não carregou. Aguarde e tente novamente.";
    return;
  }

  const button=form.querySelector('button[type="submit"]');
  button.disabled=true;

  try{
    let ordem=0;

    for(const image of album.images){
      if(image.removed||!image.file)continue;

      const uploadedUrl=await uploadProjectCover(image.file);

      const result=await supabaseClient
        .from("project_images")
        .insert({
          project_id:id,
          uploaded_by:state.user.id,
          arquivo_url:uploadedUrl,
          ordem:ordem++
        })
        .select("id")
        .single();

      if(result.error)throw result.error;

      if(album.coverUrl===image.url){
        album.coverUrl=uploadedUrl;
      }

      URL.revokeObjectURL(image.url);
      image.url=uploadedUrl;
      image.id=result.data.id;
      image.file=null;
    }

    for(const image of album.images){
      if(!image.removed||!image.id)continue;

      const result=await supabaseClient
        .from("project_images")
        .delete()
        .eq("id",image.id)
        .eq("project_id",id);

      if(result.error)throw result.error;
    }

    const imagem_capa_url=album.coverUrl||null;

    const result=await supabaseClient
      .from("projects")
      .update({
        titulo:form.elements.titulo.value.trim(),
        descricao:form.elements.descricao.value.trim(),
        objetivo:form.elements.objetivo.value.trim()||null,
        area:form.elements.area.value.trim()||"Não informada",
        tipo_participacao:
          form.elements.tipo_participacao.value,
        imagem_capa_url
      })
      .eq("id",id)
      .eq("autora_id",state.user.id)
      .select()
      .single();

    if(result.error)throw result.error;

    editingProjectAlbum=null;
    closeModal();
    await loadData();
    await goPage(state.page);
    showToast("Projeto e álbum atualizados.");
  }catch(error){
    console.error("Erro ao salvar projeto/álbum:",error);
    message.textContent=authError(error);
  }finally{
    button.disabled=false;
  }
}
async function deleteProject(project){
  if(!project||!state.user||
     String(project.autora_id)!==String(state.user.id)){
    showToast("Você não tem permissão para excluir este projeto.");
    return;
  }

  const confirmed=window.confirm(
    `Excluir definitivamente o projeto “${project.titulo}”? Esta ação não pode ser desfeita.`
  );

  if(!confirmed)return;

  const r=await supabaseClient
    .from("projects")
    .delete()
    .eq("id",project.id)
    .eq("autora_id",state.user.id);

  if(r.error){
    showToast(authError(r.error));
    return;
  }

  closeModal();
  await loadData();
  await goPage(state.page);
  showToast("Projeto excluído.");
}
async function toggleProjectLike(projectId){
  if(!state.user){
    showToast("Entre para curtir projetos.");
    return;
  }

  const existing=await supabaseClient
    .from("project_likes")
    .select("id")
    .eq("project_id",projectId)
    .eq("user_id",state.user.id)
    .maybeSingle();

  if(existing.error){
    showToast(authError(existing.error));
    return;
  }

  const result=existing.data
    ?await supabaseClient
      .from("project_likes")
      .delete()
      .eq("id",existing.data.id)
    :await supabaseClient
      .from("project_likes")
      .insert({
        project_id:projectId,

async function resolveUsername(v){const x=String(v||"").trim().toLowerCase();if(x.includes("@"))return x;const r=await supabaseClient.rpc("resolve_username",{username_input:x});if(r.error)throw r.error;return r.data?.[0]?.email||null}async function loadProfile(user){const r=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();if(r.error)throw r.error;state.profile=r.data||null}async function loadData(){if(!state.user)return;const [p,n,f]=await Promise.all([supabaseClient.from("projects").select("*").order("created_at",{ascending:false}),supabaseClient.from("news").select("*").eq("status","publicado"),supabaseClient.from("favorites").select("*").eq("user_id",state.user.id)]);if(!p.error)state.projects=p.data||[];if(!n.error)state.news=n.data||[];if(!f.error)state.favorites=f.data||[]}async function finishSession(session){state.session=session;state.user=session?.user||null;if(!state.user){state.profile=null;renderLogin();return}await loadProfile(state.user);if(!state.profile){if(state.user.identities?.some(x=>x.provider==="google")){googleProfileModal();return}showToast("Perfil não encontrado.");return}await loadData();renderApp()}

async function uploadProjectCover(file){if(!file)return null;const path=`${state.user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const r=await supabaseClient.storage.from("project-covers").upload(path,file,{upsert:false});if(r.error)throw r.error;return supabaseClient.storage.from("project-covers").getPublicUrl(path).data.publicUrl}async function uploadProfilePhoto(file){if(!file)return state.profile?.foto_url||null;const path=`${state.user.id}/profile-${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const r=await supabaseClient.storage.from("project-covers").upload(path,file,{upsert:false});if(r.error)throw r.error;return supabaseClient.storage.from("project-covers").getPublicUrl(path).data.publicUrl}
async function createProject(e){
  e.preventDefault();

  const form=e.target;
  const message=document.getElementById("project-message");
  const button=form.querySelector('button[type="submit"]');

  button.disabled=true;

  try{
    const selected=[
      ...form.querySelectorAll('[name="step"]:checked')
    ];

    const progresso=selected.reduce(
      (sum,item)=>sum+Number(item.dataset.percent||0),
      0
    );

    const uploadedImages=[];

    for(const image of newProjectAlbum){
      const arquivo_url=await uploadProjectCover(image.file);

      uploadedImages.push({
        arquivo_url,
        cover:image.cover
      });
    }

    const selectedCover=uploadedImages.find(
      image=>image.cover
    );

    const created=await supabaseClient
      .from("projects")
      .insert({
        titulo:form.elements.titulo.value.trim(),
        descricao:form.elements.descricao.value.trim(),
        objetivo:form.elements.objetivo.value.trim()||null,
        area:form.elements.area.value.trim()||
          "Não informada",
        tipo_participacao:
          form.elements.tipo_participacao.value,
        autora_id:state.user.id,
        progresso,
        status:
          progresso===100
            ?"concluido"
            :progresso
              ?"em_andamento"
              :"planejamento",
        status_publicacao:"publicado",
        imagem_capa_url:
          selectedCover?.arquivo_url||null
      })
      .select()
      .single();

    if(created.error)throw created.error;

    const projectId=created.data.id;

    if(uploadedImages.length){
      const imagesResult=await supabaseClient
        .from("project_images")
        .insert(
          uploadedImages.map((image,index)=>({
            project_id:projectId,
            uploaded_by:state.user.id,
            arquivo_url:image.arquivo_url,
            ordem:index
          }))
        );

      if(imagesResult.error){
        throw new Error(
          "O projeto foi criado, mas não foi possível " +
          "registrar todas as fotos no álbum: " +
          imagesResult.error.message
        );
      }
    }

    if(selected.length){
      const stepsResult=await supabaseClient
        .from("project_steps")
        .insert(
          selected.map((item,index)=>({
            project_id:projectId,
            titulo:
              defaultSteps[Number(item.value)].titulo,
            ordem:index+1,
            concluida:true
          }))
        );

      if(stepsResult.error){
        throw new Error(
          "O projeto foi criado, mas não foi possível " +
          "registrar o roadmap: " +
          stepsResult.error.message
        );
      }
    }

    newProjectAlbum.forEach(image=>{
      URL.revokeObjectURL(image.url);
    });

    newProjectAlbum=[];
    closeModal();
    await loadData();
    await goPage("projects");
    showToast("Projeto criado com álbum e capa.");
  }catch(error){
    console.error("Erro ao criar projeto:",error);
    message.textContent=authError(error);
  }finally{
    button.disabled=false;
  }
}
async function createUpdate(e){e.preventDefault();const f=e.target,id=f.dataset.project;const r=await supabaseClient.from("project_updates").insert({project_id:id,author_id:state.user.id,titulo:f.elements.titulo.value.trim(),descricao:f.elements.descricao.value.trim()});if(r.error){showToast(authError(r));return}closeModal();showToast("Atualização publicada como notícia.");await goPage("news")}async function saveProfile(e){e.preventDefault();const f=e.target,m=document.getElementById("profile-message"),button=f.querySelector('button[type="submit"]');if(f.elements.password.value&&f.elements.password.value!==f.elements.password2.value){m.textContent="As senhas não conferem.";return}button.disabled=true;try{const foto_url=await uploadProfilePhoto(f.elements.foto.files?.[0]);const r=await supabaseClient.from("profiles").update({nome:f.elements.nome.value.trim(),username:f.elements.username.value.trim().toLowerCase(),curso:f.elements.curso.value||null,foto_url}).eq("id",state.user.id);if(r.error)throw r.error;if(f.elements.password.value){const p=await supabaseClient.auth.updateUser({password:f.elements.password.value});if(p.error)throw p.error}await loadProfile(state.user);closeModal();renderApp();showToast("Perfil atualizado com sucesso.")}catch(x){m.textContent=authError(x)}finally{button.disabled=false}}async function sendPasswordReset(){const r=await supabaseClient.auth.resetPasswordForEmail(state.user.email,{redirectTo:APP_URL});if(r.error)showToast(authError(r));else showToast("Link de redefinição enviado para seu e-mail.")}

document.addEventListener("click",async e=>{
  const coverButton=e.target.closest("[data-album-cover]");
  const removeButton=e.target.closest("[data-album-remove]");

  if(coverButton && editingProjectAlbum){
    const image=editingProjectAlbum.images[
      Number(coverButton.dataset.albumCover)
    ];

    if(image && !image.removed){
      editingProjectAlbum.coverUrl=image.url;
      renderProjectAlbumEditor();
    }

    return;
  }

  if(removeButton && editingProjectAlbum){
    const image=editingProjectAlbum.images[
      Number(removeButton.dataset.albumRemove)
    ];

    if(image){
      image.removed=true;

      if(editingProjectAlbum.coverUrl===image.url){
        editingProjectAlbum.coverUrl=
          editingProjectAlbum.images.find(x=>!x.removed)?.url||null;
      }

      renderProjectAlbumEditor();
    }

    return;
  }
  const p=e.target.closest("[data-page]");
  const a=e.target.closest("[data-action]");
  const o=e.target.closest("[data-oauth]");
  const t=e.target.closest("[data-toggle-password]");
  const project=e.target.closest(".project-card[data-project]");
  const projectNews=e.target.closest("[data-project-news]");

      if(p){
    e.preventDefault();

    document.querySelector(".techna-header-nav")?.classList.remove("is-open");
    document.querySelector(".techna-mobile-menu-button")
      ?.setAttribute("aria-expanded","false");
    goPage(p.dataset.page);
  }

  if(project&&!projectNews&&!a){
  openProject(project.dataset.project);
}

  if(projectNews){
    openProject(projectNews.dataset.projectNews);
  }

  if(o){
    oauth(o.dataset.oauth);
  }

  if(t){
    const i=document.getElementById(t.dataset.togglePassword);

    if(i){
      i.type=i.type==="password"?"text":"password";
    }
  }

  if(a){
    const n=a.dataset.action;
    if(n==="mobile-menu"){
      const nav=document.querySelector(".techna-header-nav");
      const aberto=nav?.classList.toggle("is-open")||false;
      a.setAttribute("aria-expanded",String(aberto));
    }
    
    if(n==="decide-participation"){
      const requestId=a.dataset.requestId;
      const projectId=a.dataset.projectId;
      const decision=a.dataset.decision;

      if(!requestId || !projectId)return;

      const buttons=[
        ...document.querySelectorAll(
          `[data-request-id="${requestId}"]`
        )
      ];

      buttons.forEach(button=>button.disabled=true);

      const result=await supabaseClient.rpc(
        "decidir_participacao",
        {
          p_request_id:requestId,
          p_decisao:decision
        }
      );

      if(result.error){

      }

      showToast(

      );

    if(n==="logout"){

  .techna-notification-item small{
    margin-top:5px;
    color:#686473;
  }
  .techna-notification-empty{
    margin:12px 0 4px;
    color:#686473;
  }
`;
document.head.appendChild(technaBellStyle);

const technaBellSvg=`
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18
             c0-2-3-2-3-9"></path>
    <path d="M10 21h4"></path>
  </svg>
  <span class="techna-bell-count" hidden></span>
`;

let technaNotificationMenu=null;
function technaCancelBellHoverClose(){
  clearTimeout(technaBellHoverTimer);
  technaBellHoverTimer=null;
}

function technaScheduleBellHoverClose(){
  technaCancelBellHoverClose();

  technaBellHoverTimer=setTimeout(()=>{
    technaCloseNotifications();
  },220);
}

function technaPrepareBell(){
  const button=document.querySelector(
    '[data-action="notifications"]'
  );

  if(!button)return null;

  if(!button.classList.contains("techna-bell-button")){
    button.classList.add("techna-bell-button");
    button.innerHTML=technaBellSvg;
    button.setAttribute("title","Notificações");
    button.setAttribute("aria-label","Abrir notificações");
    button.setAttribute("aria-expanded","false");
  }
  if(!button.dataset.hoverReady){
    button.dataset.hoverReady="true";

    button.addEventListener("mouseenter",()=>{
      technaCancelBellHoverClose();

      if(!technaNotificationMenu){
        technaToggleNotifications();
      }
    });

    button.addEventListener("mouseleave",()=>{
      technaScheduleBellHoverClose();
    });
  }
  
  return button;
}

async function technaRefreshBell(){
  const button=technaPrepareBell();
  const userId=state.user?.id;

  if(!button||!userId)return;

  const result=await supabaseClient
    .from("notifications")
    .select("id",{count:"exact",head:true})
    .eq("user_id",userId)
    .eq("lida",false);

  if(result.error){
    console.error(
      "Erro ao contar notificações:",
      result.error
    );
    return;
  }

  if(state.user?.id!==userId)return;

  const currentButton=technaPrepareBell();
  const badge=currentButton?.querySelector(
    ".techna-bell-count"
  );

  if(!badge)return;

  const count=result.count||0;
  badge.hidden=count===0;
  badge.textContent=count>99?"99+":String(count);

  currentButton.setAttribute(
    "aria-label",
    count
      ?`${count} notificações não lidas`
      :"Abrir notificações"
  );
}

function technaCloseNotifications(){
  if(technaNotificationMenu){
    technaNotificationMenu.remove();
    technaNotificationMenu=null;
  }

  document
    .querySelector('[data-action="notifications"]')
    ?.setAttribute("aria-expanded","false");
}

async function technaToggleNotifications(){
  if(technaNotificationMenu){
    technaCloseNotifications();
    return;
  }

  const button=technaPrepareBell();
  const userId=state.user?.id;

  if(!button||!userId)return;

  const menu=document.createElement("div");
  menu.className="techna-notification-menu";
  menu.innerHTML=`
    <h3>Notificações</h3>
    <p class="techna-notification-empty">
      Carregando notificações...
    </p>
  `;

  document.body.appendChild(menu);
  technaNotificationMenu=menu;
  menu.addEventListener("mouseenter",()=>{
    technaCancelBellHoverClose();
  });

  menu.addEventListener("mouseleave",()=>{
    technaScheduleBellHoverClose();
  });
  button.setAttribute("aria-expanded","true");

  const rect=button.getBoundingClientRect();
  const menuWidth=Math.min(380,window.innerWidth-24);

  menu.style.top=`${Math.min(
    rect.bottom+8,
    window.innerHeight-90
  )}px`;

  menu.style.left=`${Math.max(
    12,
    Math.min(
      rect.right-menuWidth,
      window.innerWidth-menuWidth-12
    )
  )}px`;

  const result=await supabaseClient
    .from("notifications")
    .select(
      "id,titulo,mensagem,lida,created_at"
    )
    .eq("user_id",userId)
    .order("created_at",{ascending:false})
    .limit(50);

  if(!menu.isConnected||state.user?.id!==userId)return;

  if(result.error){
    console.error(
      "Erro ao carregar notificações:",
      result.error
    );

    menu.innerHTML=`
      <h3>Notificações</h3>
      <p class="techna-notification-empty">
        Não foi possível carregar as notificações.
      </p>
    `;
    return;
  }

  const notifications=result.data||[];

  menu.innerHTML=`
    <h3>Notificações</h3>
    ${
      notifications.length
        ?notifications.map(item=>`
          <div class="techna-notification-item">
            <strong>
              ${esc(item.titulo||"Notificação")}
            </strong>
            <span>
              ${esc(item.mensagem||"")}
            </span>
            <small>
              ${new Date(item.created_at)
                .toLocaleString("pt-BR")}
            </small>
          </div>
        `).join("")
        :`<p class="techna-notification-empty">
            Você ainda não tem notificações.
          </p>`
    }
  `;

  const unreadIds=notifications
    .filter(item=>!item.lida)
    .map(item=>item.id);

  if(unreadIds.length){
    const update=await supabaseClient
      .from("notifications")
      .update({lida:true})
      .eq("user_id",userId)
      .in("id",unreadIds);

    if(update.error){
      console.error(
        "Erro ao marcar notificações como lidas:",
        update.error
      );
    }else{
      await technaRefreshBell();
    }
  }
}

/* Impede a mensagem fixa do botão antigo. */
document.addEventListener("click",event=>{
  const bell=event.target.closest(
    '[data-action="notifications"]'
  );

  if(bell){
    event.preventDefault();
    event.stopImmediatePropagation();
    technaToggleNotifications();
    return;
  }

  if(
    technaNotificationMenu &&
    !event.target.closest(".techna-notification-menu")
  ){
    technaCloseNotifications();
  }
},true);

/* O site recria o cabeçalho em renderApp().
   Prepara o sino imediatamente após cada reconstrução. */
const technaOriginalRenderApp=renderApp;

renderApp=function(...args){
  technaCloseNotifications();

  const result=technaOriginalRenderApp.apply(this,args);

  technaPrepareBell();
  technaRefreshBell();

  return result;
};

technaPrepareBell();
technaRefreshBell();
setInterval(technaRefreshBell,15000);
</script>
<script>
(() => {
  let pedidoInstalacao = null;

  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    pedidoInstalacao = event;
  });

  window.addEventListener("appinstalled", () => {
    pedidoInstalacao = null;
  });

  document.addEventListener("click", async event => {
    const botao = event.target.closest('[data-action="install-app"]');
    if (!botao) return;

    event.preventDefault();

    const instalado =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (instalado) {
      alert("O TECHNA já está instalado neste celular.");
      return;
    }

    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (ios) {
      alert(
        "Para instalar o TECHNA no iPhone: abra este site no Safari, " +
        "toque em Compartilhar, escolha Adicionar à Tela de Início, " +
        "ative Abrir como App e toque em Adicionar."
      );
      return;
    }

    if (pedidoInstalacao) {
      const pedido = pedidoInstalacao;
      pedidoInstalacao = null;
      await pedido.prompt();
      return;
    }

    alert(
      "Abra o menu do navegador e escolha Instalar app ou " +
      "Adicionar à tela inicial. Se o TECHNA já estiver instalado, " +
      "essa opção pode não aparecer."
    );
  });
})();
</script>
