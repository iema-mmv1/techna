/main>`;initCanvas()}
function initCanvas(){const canvas=document.getElementById("network-canvas");if(!canvas)return;const ctx=canvas.getContext("2d"),reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches,points=[],colors=["#fff","#decbe2","#f5d4e7","#a8d719"];let width=0,height=0,pointer={x:null,y:null};function resize(){const ratio=Math.min(window.devicePixelRatio||1,2);width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);points.length=0;const count=Math.min(74,Math.max(28,Math.floor(width*height/17000)));for(let i=0;i<count;i++)points.push({x:Math.random()*width,y:Math.random()*height,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,radius:Math.random()*2.2+1,color:colors[i%colors.length]})}function draw(){ctx.clearRect(0,0,width,height);for(const point of points){if(!reduced){point.x+=point.vx;point.y+=point.vy;if(point.x<0||point.x>width)point.vx*=-1;if(point.y<0||point.y>height)point.vy*=-1}if(pointer.x!==null){const dx=pointer.x-point.x,dy=pointer.y-point.y,d=Math.hypot(dx,dy);if(d<130&&d>0){point.x-=dx/d*.12;point.y-=dy/d*.12}}}for(let i=0;i<points.length;i++){for(let j=i+1;j<points.length;j++){const a=points[i],b=points[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){ctx.strokeStyle=`rgba(255,255,255,${Math.max(0,.22-d/900)})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}for(const point of points){ctx.fillStyle=point.color;ctx.beginPath();ctx.arc(point.x,point.y,point.radius,0,Math.PI*2);ctx.fill()}if(!reduced)requestAnimationFrame(draw)}resize();window.addEventListener("resize",()=>{resize();if(reduced)draw()});canvas.addEventListener("pointermove",event=>{const box=canvas.getBoundingClientRect();pointer.x=event.clientX-box.left;pointer.y=event.clientY-box.top});canvas.addEventListener("pointerleave",()=>{pointer.x=null;pointer.y=null});draw()}

function newsCard(n){return`<article class="news-card" data-news="${esc(n.id)}"><div class="news-image"></div><div class="news-body"><small>${esc(n.categoria||"Notícia")}</small><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo)}</p></div></article>`}
function pageFrame(html,title,subtitle){document.getElementById("pageTitle").textContent=title;document.getElementById("pageSubtitle").textContent=subtitle;document.getElementById("pageContent").innerHTML=html}
function dashboard(){const ps=dataProjects(),ns=dataNews(),avg=ps.length?Math.round(ps.reduce((sum,p)=>sum+Number(p.progresso||0),0)/ps.length):0;pageFrame(`<div class="stats"><article class="stat"><small>Meus projetos</small><b>${state.projects.length}</b><em>Projetos cadastrados</em></article><article class="stat"><small>Em acompanhamento</small><b>0</b><em>Em breve</em></article><article class="stat"><small>Convites</small><b>0</b><em>Nenhuma pendência</em></article><article class="stat"><small>Progresso médio</small><b>${avg}%</b><em>Baseado nos projetos</em></article></div><div class="dash-grid"><section class="card wide"><div class="card-head"><div><h2>Em destaque</h2><p>Notícias e projetos da comunidade.</p></div></div><div class="carousel"><div class="carousel-track">${ns.map(n=>`<div class="slide"><div class="slide-image"></div><div class="slide-content"><small>${esc(n.categoria)}</small><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo)}</p><button class="btn btn-primary" style="width:max-content;margin-top:18px" data-news="${esc(n.id)}">Abrir notícia</button></div></div>`).join("")}</div><div class="arrows"><button data-carousel="prev">‹</button><button data-carousel="next">›</button></div></div></section><section class="card wide"><div class="card-head"><div><h2>Notícias recentes</h2><p>Role para o lado para acompanhar as novidades.</p></div><button class="btn btn-ghost" data-page="news">Ver todas</button></div><div class="horizontal">${ns.map(newsCard).join("")}</div></section><section class="card"><div class="card-head"><div><h2>Meus projetos</h2><p>Etapas e progresso.</p></div><button class="btn btn-primary" data-action="new-project">Novo projeto</button></div><div class="project-grid">${ps.slice(0,4).map(projectCard).join("")}</div></section><section class="card"><div class="card-head"><div><h2>Interações</h2><p>Continue participando.</p></div></div><div class="notice"><strong>Encontre colaboradores</strong><p>Usuários com interesses semelhantes poderão ser sugeridos aqui.</p><button class="btn btn-secondary" data-action="recommendations">Ver sugestões</button></div></section></div>`,...pageTitle())}
function projectsPage(){pageFrame(`<section class="card"><div class="card-head"><div><h2>Projetos</h2><p>Crie, explore e acompanhe projetos.</p></div><button class="btn btn-primary" data-action="new-project">Novo projeto</button></div><div class="toolbar"><input class="input" id="project-search" placeholder="Buscar projetos"><select class="select" id="project-filter"><option value="">Todos os status</option><option value="planejamento">Planejamento</option><option value="em andamento">Em andamento</option><option value="em testes">Em testes</option><option value="concluído">Concluído</option></select></div><div class="project-grid" id="project-list">${dataProjects().map(projectCard).join("")}</div></section>`,...pageTitle())}
function newsPage(){pageFrame(`<section class="card"><div class="card-head"><div><h2>Notícias</h2><p>Atualizações, destaques e novidades.</p></div></div><div class="horizontal">${dataNews().map(newsCard).join("")}</div><h3 style="color:var(--p);margin-top:27px">Mais recentes</h3><div class="list">${dataNews().map(n=>`<div class="list-item" data-news="${esc(n.id)}"><div class="news-image" style="width:62px;height:62px;flex:0 0 62px;border-radius:10px"></div><div><h3 style="margin:0 0 4px;color:var(--p)">${esc(n.titulo)}</h3><p class="muted" style="margin:0">${esc(n.resumo)}</p></div></div>`).join("")}</div></section>`,...pageTitle())}
function favoritesPage(){pageFrame(`<section class="card"><div class="card-head"><div><h2>Favoritos</h2><p>Projetos e notícias salvos por você.</p></div></div>${state.favorites.length?`<div class="list">${state.favorites.map(f=>`<div class="list-item"><div><h3 style="margin:0;color:var(--p)">${esc(f.titulo||f.projectid||f.newsid)}</h3><p class="muted">Salvo recentemente.</p></div></div>`).join("")}</div>`:`<div class="empty">Você ainda não favoritou nenhum projeto ou notícia.</div>`}</section>`,...pageTitle())}
function votingPage(){pageFrame(`<section class="card"><div class="card-head"><div><h2>Destaque do mês</h2><p>Vote no projeto que merece reconhecimento.</p></div></div><div class="notice">A votação será carregada do banco quando houver uma votação publicada.</div><div class="project-grid" style="margin-top:17px">${dataProjects().map(p=>`<article class="project-card"><div class="project-cover"><h3>${esc(p.titulo)}</h3></div><div class="project-body"><p>${esc(p.descricao)}</p><button class="btn btn-secondary full" data-action="vote">Votar</button></div></article>`).join("")}</div></section>`,...pageTitle())}
function suggestionsPage(){pageFrame(`<section class="card"><div class="card-head"><div><h2>Sugestões</h2><p>Ajude a construir a TECHNA.</p></div><button class="btn btn-primary" data-action="new-suggestion">Nova sugestão</button></div><div class="empty">Nenhuma sugestão registrada nesta sessão.</div></section>`,...pageTitle())}
function profilePage(){const p=state.profile||state.user?.user_metadata||{};pageFrame(`<section class="card"><div class="profile-head">${avatar(p,true)}<div><h2 style="margin:0;color:var(--p)">${esc(p.nome||"Usuário")}</h2><p class="muted" style="margin:5px 0">${esc(p.username||"usuário")} · ${esc(p.curso||"Sem curso")}</p></div><button class="btn btn-secondary" style="margin-left:auto" data-action="edit-profile">Editar perfil</button></div><div class="form-grid" style="margin-top:22px"><div class="field"><label>E-mail</label><div class="input muted">${esc(state.user?.email||"Não informado")}</div></div><div class="field"><label>Tipo de conta</label><div class="input muted">${p.tiposolicitado==="professor"?"Professor":"Aluno"}</div></div></div></section>`,...pageTitle())}
function teacherPage(){pageFrame(`<section class="card"><div class="card-head"><div><h2>Área dos professores</h2><p>Orientações e projetos acompanhados.</p></div></div><div class="tabs"><button class="btn btn-secondary">Convites recebidos</button><button class="btn btn-ghost">Minhas orientações</button><button class="btn btn-ghost">Solicitar orientação</button></div><div class="empty">Convites e solicitações serão carregados do Supabase.</div></section>`,...pageTitle())}
function adminPage(){pageFrame(`<section class="card"><div class="card-head"><div><h2>Painel administrativo</h2><p>Gerencie a comunidade TECHNA.</p></div></div><div class="stats"><div class="stat"><small>Usuários</small><b>0</b></div><div class="stat"><small>Projetos pendentes</small><b>0</b></div><div class="stat"><small>Notícias</small><b>0</b></div><div class="stat"><small>Denúncias</small><b>0</b></div></div><div class="tabs"><button class="btn btn-secondary">Usuários</button><button class="btn btn-ghost">Projetos</button><button class="btn btn-ghost">Notícias</button><button class="btn btn-ghost">Votações</button><button class="btn btn-ghost">Moderação</button></div><div class="empty">Os dados administrativos serão carregados com permissões RLS.</div></section>`,...pageTitle())}
function goPage(page){state.page=page;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const pages={dashboard,projects:projectsPage,news:newsPage,favorites:favoritesPage,voting:votingPage,suggestions:suggestionsPage,profile:profilePage,teacher:teacherPage,admin:adminPage};(pages[page]||dashboard)();document.getElementById("sidebar")?.classList.remove("open")}
function renderApp(){const p=state.profile||state.user?.user_metadata||{};app.innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar">${brand()}<nav class="nav"><button data-page="dashboard">▦ Visão geral</button><button data-page="projects">▣ Projetos</button><button data-page="news">▤ Notícias</button><button data-page="favorites">♡ Favoritos</button><button data-page="voting">★ Destaque do mês</button><button data-page="suggestions">✦ Sugestões</button><button data-page="profile">● Meu perfil</button><button data-page="teacher">◈ Área dos professores</button><button data-page="admin">⚙ Administração</button></nav><div class="sidebar-bottom"><div class="mini-profile">${avatar(p)}<div><strong>${esc(p.nome||state.user?.email||"Usuário")}</strong><small>${esc(p.username||"usuário")}</small></div></div><button class="logout" data-action="logout">Sair da conta</button></div></aside><main class="main"><header class="topbar"><div><button class="icon-btn menu" data-action="toggle-menu">☰</button><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div><div class="top-actions"><div class="socials"><a class="fb" href="#" aria-label="Facebook">f</a><a class="ig" href="#" aria-label="Instagram">◎</a><a class="yt" href="#" aria-label="YouTube">▶</a></div><button class="icon-btn" data-action="notifications" aria-label="Notificações">♢</button></div></header><section id="pageContent"></section></main></div>`;goPage(state.page)}
function openModal(title,body){modalRoot.innerHTML=`<div class="modal-bg" data-close-modal><div class="modal"><div class="modal-head"><h2>${title}</h2><button type="button" class="close" data-close-modal>×</button></div>${body}</div></div>`}function closeModal(){modalRoot.innerHTML=""}
function registerModal(){openModal("Criar conta",`<form id="account-form" novalidate><div class="form-grid"><div class="field span-2"><label>Nome completo</label><input class="input" name="nome" autocomplete="name" required></div><div class="field span-2"><label>Username</label><input class="input" name="username" id="account-username" pattern="[a-z0-9_]{3,30}" autocomplete="username" required><span class="availability" id="usernameState">Use letras minúsculas, números e sublinhado.</span></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" minlength="6" autocomplete="new-password" required></div><div class="field span-2"><label>Tipo de conta</label><div class="role-grid"><button type="button" class="role selected" data-role="aluno"><strong>Aluno</strong><small>Cria e participa</small></button><button type="button" class="role" data-role="professor"><strong>Professor</strong><small>Orienta projetos</small></button></div><input type="hidden" name="tipo" value="aluno"></div><div class="field span-2" id="courseField"><label>Curso</label><select class="select" name="curso"><option value="">Escolha seu curso</option><option>Marketing</option><option>Administração</option><option>Informática</option><option>Informática para Internet</option></select></div></div><p id="account-message" class="message" role="alert"></p><button type="submit" class="btn btn-primary full">Criar conta</button></form>`);document.querySelectorAll("[data-role]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-role]").forEach(x=>x.classList.remove("selected"));button.classList.add("selected");document.querySelector('[name="tipo"]').value=button.dataset.role;document.getElementById("courseField").classList.toggle("hidden",button.dataset.role!=="aluno")}));document.getElementById("account-username").addEventListener("input",debounce(checkUsername,450))}
function debounce(fn,ms){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),ms)}}
async function checkUsername(){const input=document.getElementById("account-username"),out=document.getElementById("usernameState");if(!input||!out)return;input.value=input.value.toLowerCase().replace(/[^a-z0-9_]/g,"");if(input.value.length<3){out.textContent="Use pelo menos 3 caracteres.";out.className="availability bad";return}if(!supabaseClient){out.textContent="Username informado.";return}const result=await supabaseClient.from("profiles").select("id").ilike("username",input.value).maybeSingle();out.textContent=result.error?"Não foi possível verificar agora.":result.data?"Username ocupado.":"Username disponível.";out.className="availability "+(result.data?"bad":"ok")}
function openForgot(){openModal("Recuperar acesso",`<p class="muted">Informe o e-mail da sua conta para receber instruções.</p><form id="forgot-form"><div class="field"><label>E-mail</label><input class="input" id="forgot-email" type="email" required></div><p id="forgot-message" class="message"></p><button class="btn btn-primary full" type="submit">Enviar instruções</button></form>`)}
function projectModal(){openModal("Novo projeto",`<form id="project-form"><div class="form-grid"><div class="field span-2"><label>Título</label><input class="input" name="titulo" required></div><div class="field span-2"><label>Descrição</label><textarea class="textarea" name="descricao" required></textarea></div><div class="field"><label>Objetivo</label><input class="input" name="objetivo"></div><div class="field"><label>Área</label><select class="select" name="area"><option>Informática</option><option>Marketing</option><option>Administração</option></select></div><div class="field"><label>Visibilidade</label><select class="select" name="tipoparticipacao"><option value="aberto">Público</option><option value="fechado">Privado</option></select></div><div class="field"><label>Imagem de capa</label><input class="input" type="url" name="imagemcapaurl"></div><div class="field span-2"><label>Etapas</label><div class="steps">${defaultSteps.map((step,i)=>`<label class="step"><input type="checkbox" name="step" value="${i}">${esc(step)}</label>`).join("")}</div></div></div><p id="project-message" class="message"></p><button class="btn btn-primary full" type="submit">Criar projeto</button></form>`)}
function newsModal(){openModal("Nova notícia",`<form id="news-form"><div class="field"><label>Título</label><input class="input" name="titulo" required></div><div class="field"><label>Resumo</label><textarea class="textarea" name="resumo" required></textarea></div><div class="field"><label>Conteúdo</label><textarea class="textarea" name="conteudo" required></textarea></div><button class="btn btn-primary full" type="submit">Salvar rascunho</button></form>`)}
function suggestionModal(){openModal("Nova sugestão",`<form id="suggestion-form"><div class="field"><label>Tipo</label><select class="select" name="tipo"><option>Melhoria visual</option><option>Nova funcionalidade</option><option>Correção</option><option>Outra sugestão</option></select></div><div class="field"><label>Título</label><input class="input" name="titulo" required></div><div class="field"><label>Descrição</label><textarea class="textarea" name="conteudo" required></textarea></div><button class="btn btn-primary full" type="submit">Enviar sugestão</button></form>`)}
async function findEmailByUsername(username){const normalized=String(username||"").trim().toLowerCase();if(!normalized||!supabaseClient)return null;const result=await supabaseClient.rpc("resolve_username",{username_input:normalized});return result.error?null:result.data?.[0]?.email||null}
async function loadProfile(user){const result=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();state.profile=result.data||{id:user.id,nome:user.user_metadata?.nome||"Novo estudante",username:user.user_metadata?.username||"",email:user.email,curso:user.user_metadata?.curso||null,tiposolicitado:user.user_metadata?.tipo_solicitado||"aluno"}}
async function loadData(){if(!supabaseClient||!state.user)return;const [projects,news,favorites]=await Promise.all([supabaseClient.from("projects").select("*").order("createdat",{ascending:false}),supabaseClient.from("news").select("*").eq("status","publicado").order("createdat",{ascending:false}),supabaseClient.from("favorites").select("*").eq("userid",state.user.id)]);if(!projects.error)state.projects=projects.data||[];if(!news.error)state.news=news.data||[];if(!favorites.error)state.favorites=favorites.data||[]}
async function loadUser(session){state.session=session;state.user=session?.user||null;if(!state.user){state.profile=null;state.projects=[];state.news=[];state.favorites=[];renderLogin();return}await loadProfile(state.user);await loadData();renderApp()}
async function register(event){event.preventDefault();const form=event.currentTarget,message=document.getElementById("account-message"),button=form.querySelector('button[type="submit"]');const nome=form.elements.namedItem("nome")?.value?.trim();const username=form.elements.namedItem("username")?.value?.trim().toLowerCase();const email=form.elements.namedItem("email")?.value?.trim().toLowerCase();const password=form.elements.namedItem("password")?.value||"";const tipo=form.elements.namedItem("tipo")?.value;const curso=form.elements.namedItem("curso")?.value||null;message.textContent="";if(!nome){message.textContent="Informe seu nome completo.";return}if(!/^[a-z0-9_]{3,30}$/.test(username||"")){message.textContent="Use de 3 a 30 caracteres: letras minúsculas, números e sublinhado.";return}if(!email||!email.includes("@")){message.textContent="Informe um e-mail válido.";return}if(password.length<6){message.textContent="A senha precisa ter pelo menos 6 caracteres.";return}if(!["aluno","professor"].includes(tipo)){message.textContent="Escolha Aluno ou Professor.";return}if(tipo==="aluno"&&!curso){message.textContent="Escolha seu curso.";return}if(!supabaseClient){message.textContent="Configure o Supabase antes do cadastro.";return}button.disabled=true;button.textContent="Criando conta...";try{const result=await supabaseClient.auth.signUp({email,password,options:{data:{nome,username,tipo_solicitado:tipo,curso:tipo==="aluno"?curso:null}}});if(result.error)throw result.error;message.classList.add("ok");message.textContent=result.data?.session?"Cadastro realizado com sucesso.":"Cadastro criado. Confirme o e-mail antes de entrar.";if(result.data?.session){await loadUser(result.data.session);closeModal()}}catch(error){message.textContent=authError(error)}finally{button.disabled=false;button.textContent="Criar conta"}}
async function login(event){event.preventDefault();const form=event.currentTarget,message=document.getElementById("login-message"),button=form.querySelector('button[type="submit"]');if(!supabaseClient){message.textContent="Configure o Supabase antes de entrar.";return}const identifier=form.elements.namedItem("identifier")?.value?.trim();const password=form.elements.namedItem("password")?.value||"";message.textContent="";if(!identifier){message.textContent="Informe seu e-mail ou nome de usuário.";return}if(password.length<6){message.textContent="A senha precisa ter pelo menos 6 caracteres.";return}button.disabled=true;button.textContent="Entrando...";try{const email=identifier.includes("@")?identifier.toLowerCase():await findEmailByUsername(identifier);if(!email){message.textContent="E-mail ou nome de usuário não encontrado.";return}const result=await supabaseClient.auth.signInWithPassword({email,password});if(result.error)throw result.error;await loadUser(result.data.session)}catch(error){message.textContent=authError(error)}finally{button.disabled=false;button.textContent="Entrar"}}
async function createProject(event){event.preventDefault();const form=event.currentTarget,msg=document.getElementById("project-message");if(!state.user){msg.textContent="Faça login para cadastrar um projeto.";return}const selected=[...form.querySelectorAll('[name="step"]:checked')].map((input,i)=>({titulo:defaultSteps[Number(input.value)],ordem:i+1,concluida:true}));const result=await supabaseClient.from("projects").insert({titulo:form.elements.namedItem("titulo").value.trim(),descricao:form.elements.namedItem("descricao").value.trim(),objetivo:form.elements.namedItem("objetivo").value.trim(),area:form.elements.namedItem("area").value,tipoparticipacao:form.elements.namedItem("tipoparticipacao").value,autoraid:state.user.id,progresso:Math.round(selected.length/defaultSteps.length*100),status:"planejamento",statuspublicacao:"pendente",imagemcapaurl:form.elements.namedItem("imagemcapaurl").value.trim()||null}).select().single();if(result.error){msg.textContent=apiError(result.error);return}if(selected.length)await supabaseClient.from("projectsteps").insert(selected.map(step=>({...step,projectid:result.data.id})));closeModal();await loadData();goPage("projects");showToast("Projeto criado com sucesso.")}
async function sendPasswordReset(event){event.preventDefault();const email=document.getElementById("forgot-email").value.trim(),msg=document.getElementById("forgot-message");const result=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});if(result.error){msg.textContent=authError(result.error);return}closeModal();showToast("Confira seu e-mail para redefinir a senha.")}
async function oauthLogin(provider){if(!supabaseClient){showToast("Configure o Supabase antes de usar OAuth.");return}const result=await supabaseClient.auth.signInWithOAuth({provider,options:{redirectTo:SITE_URL}});if(result.error)showToast(authError(result.error))}
document.addEventListener("submit",event=>{if(event.target.id==="login-form")login(event);if(event.target.id==="account-form")register(event);if(event.target.id==="forgot-form")sendPasswordReset(event);if(event.target.id==="project-form")createProject(event)});
document.addEventListener("click",event=>{const page=event.target.closest("[data-page]"),action=event.target.closest("[data-action]"),oauth=event.target.closest("[data-oauth]"),toggle=event.target.closest("[data-toggle-password]"),news=event.target.closest("[data-news]"),project=event.target.closest("[data-project]"),carousel=event.target.closest("[data-carousel]");if(page){event.preventDefault();goPage(page.dataset.page)}if(oauth)oauthLogin(oauth.dataset.oauth);if(toggle){const input=document.getElementById(toggle.dataset.togglePassword);input.type=input.type==="password"?"text":"password"}if(action){const name=action.dataset.action;if(name==="create-account")registerModal();if(name==="forgot-password")openForgot();if(name==="new-project")projectModal();if(name==="new-suggestion")suggestionModal();if(name==="new-news")newsModal();if(name==="toggle-menu")document.getElementById("sidebar")?.classList.toggle("open");if(name==="notifications")showToast("Você não tem novas notificações.");if(name==="recommendations")showToast("As recomendações serão carregadas na próxima etapa.");if(name==="logout")supabaseClient?.auth.signOut().then(()=>loadUser(null));if(name==="vote")showToast("A votação será ativada quando houver uma votação publicada")}if(carousel){const track=carousel.closest(".carousel")?.querySelector(".carousel-track");if(track)track.scrollBy({left:carousel.dataset.carousel==="next"?track.clientWidth:-track.clientWidth,behavior:"smooth"})}if(news){const item=dataNews().find(n=>String(n.id)===String(news.dataset.news));if(item)openModal(item.titulo,`<p class="kicker">${esc(item.categoria)}</p><p style="line-height:1.7">${esc(item.conteudo||item.resumo)}</p>`)}if(project){const item=dataProjects().find(p=>String(p.id)===String(project.dataset.project));if(item)openModal(item.titulo,`<p style="line-height:1.7">${esc(item.descricao)}</p><div class="bar"><i style="width:${Number(item.progresso||0)}%"></i></div><p class="muted">${Number(item.progresso||0)}% concluído</p>`)}});
modalRoot.addEventListener("click",event=>{if(event.target.hasAttribute("data-close-modal"))closeModal()});
if(supabaseClient)supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session&&session.user?.id!==state.user?.id)loadUser(session);if(!session&&state.user)loadUser(null)});
(async function boot(){if(!supabaseClient){renderLogin();return}const result=await supabaseClient.auth.getSession();await loadUser(result.data?.session||null)})();
</script>
</body>
</html>
