nt:center;margin-bottom:33px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:9px;width:100%;padding:12px 13px;color:#e9ddef;border:0;border-radius:12px;background:transparent;text-align:left}.nav button.active,.nav button:hover{color:#fff;background:#ffffff1c}.sidebar-bottom{margin-top:auto;padding:17px 10px 0;border-top:1px solid #fff2}.mini-profile{display:flex;align-items:center;gap:9px;margin-bottom:14px}.mini-profile strong,.mini-profile small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini-profile small{color:#dccbe3}.avatar{display:grid;flex:0 0 auto;width:40px;height:40px;place-items:center;overflow:hidden;color:var(--p);border-radius:50%;background:linear-gradient(135deg,#f5d0e6,#decbe2);font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.logout{width:100%;padding:8px 0;color:#f6dfed;border:0;background:transparent;text-align:left}.main{min-width:0;padding:27px clamp(17px,4vw,55px) 55px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:25px}.topbar h1{display:inline;margin:0;color:#35103f;font-size:clamp(1.8rem,3vw,2.6rem)}.topbar p{margin:7px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px}.icon-btn{display:grid;width:42px;height:42px;place-items:center;color:var(--p);border:1px solid var(--line);border-radius:11px;background:#fff}.menu{display:none}.card{padding:21px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 8px 25px #4d12630b}.card-head{display:flex;justify-content:space-between;gap:13px;margin-bottom:17px}.card-head h2{margin:0;color:var(--p);font-size:1.15rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:21px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff}.stat small{color:var(--muted)}.stat b{display:block;margin-top:7px;color:var(--p);font-size:1.75rem}.dash-grid{display:grid;grid-template-columns:minmax(0,1.4fr) <script>
"use strict";
const SUPABASE_URL="https://edtgebzafwkounipfvrb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_t2nSHz0OetO50wFuSGct6A_tiRt3Fu-";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true,flowType:"pkce"}});

const app=document.getElementById("app"),modalRoot=document.getElementById("modal-root"),toast=document.getElementById("toast");

function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}function showToast(text){toast.textContent=text;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),4500)}function initials(value){return String(value||"U").split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}function avatar(profile,large=false){return`<span class="avatar${large?" avatar-xl":""}">${profile?.foto_url?`<img src="${esc(profile.foto_url)}" alt="Foto de perfil">`:initials(profile?.nome||profile?.email)}</span>`}function brand(){return`<a class="brand" href="#" data-page="dashboard"><span class="brand-mark">✦</span><span class="brand-name">TECHNA</span></a>`}function authError(error){const text=String(error?.message||"").toLowerCase();if(text.includes("duplicate key"))return"Esse username já está em uso.";if(text.includes("provider is not enabled"))return"O provedor Google não está ativado no Supabase.";if(text.includes("redirect")||text.includes("url"))return"A URL de retorno não está autorizada no Supabase.";if(text.includes("email not confirmed"))return"Confirme o e-mail antes de entrar.";if(text.includes("invalid login credentials"))return"E-mail, username ou senha incorretos.";return error?.message||"Não foi possível concluir a operação."}
function renderLogin(){app.innerHTML=`<main class="login"><section class="login-art"><canvas id="network-canvas" class="network-canvas"></canvas><div>${brand()}<p class="kicker" style="margin-top:28px">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="chips"><span>Criar</span><span>Colaborar</span><span>Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e criatividade.</small></section><section class="login-panel"><div class="auth"><p class="kicker">Acesso à plataforma</p><h2>Bem-vindo à TECHNA</h2><p class="auth-intro muted">Entre para acompanhar e compartilhar projetos.</p><form id="login-form" novalidate><div class="field"><label>E-mail ou username</label><input class="input" name="identifier" autocomplete="username" required></div><div class="field"><label>Senha</label><div class="password"><input id="login-password" class="input" name="password" type="password" autocomplete="current-password" minlength="6" required><button type="button" data-toggle-password="login-password">◉</button></div></div><button type="button" class="btn btn-ghost" data-action="forgot-password">Esqueci minha senha</button><p id="login-message" class="message"></p><button type="submit" class="btn btn-primary full">Entrar</button></form><div class="divider">ou continue com</div><div class="social-login"><button type="button" data-oauth="google">Google</button><button type="button" data-oauth="facebook">Facebook</button></div><p class="muted" style="text-align:center;margin-top:22px">Ainda não tem uma conta? <button type="button" class="btn btn-secondary" data-action="create-account">Criar conta</button></p></div></section></main>`;initCanvas()}
function initCanvas(){const canvas=document.getElementById("network-canvas");if(!canvas)return;const ctx=canvas.getContext("2d");let width=0,height=0;function resize(){const ratio=Math.min(devicePixelRatio||1,2);width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0)}function draw(){ctx.clearRect(0,0,width,height);ctx.fillStyle="#ffffff55";for(let i=0;i<45;i++){ctx.beginPath();ctx.arc((i*97+Date.now()/35)%Math.max(width,1),(i*53)%Math.max(height,1),1.5,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}resize();window.addEventListener("resize",resize);draw()}
function dataProjects(){return state.projects.length?state.projects:demoProjects}function dataNews(){return state.news.length?state.news:demoNews}function projectCard(p){return`<article class="project-card" data-project="${esc(p.id)}"><div class="project-cover"><h3>${esc(p.titulo)}</h3></div><div class="project-body"><p>${esc(p.descricao)}</p><div class="bar"><i style="width:${Number(p.progresso||0)}%"></i></div><div class="project-foot"><span>${Number(p.progresso||0)}% concluído</span><span class="pill">${esc(p.status||"planejamento")}</span></div></div></article>`}function newsCard(n){return`<article class="news-card" data-news="${esc(n.id)}"><div class="news-image"></div><div class="news-body"><small>${esc(n.categoria||"Notícia")}</small><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo)}</p></div></article>`}
function titleData(){return{dashboard:["Olá, "+(state.profile?.nome?.split(" ")[0]||"estudante")+"!","Bem-vindo ao seu espaço de projetos."],projects:["Projetos","Crie, explore e acompanhe projetos."],news:["Notícias","Acompanhe o que está acontecendo na TECHNA."],favorites:["Favoritos","Consulte seus conteúdos salvos."],voting:["Destaque do mês","A comunidade escolhe em conjunto."],suggestions:["Sugestões","Sua ideia pode melhorar a plataforma."],profile:["Meu perfil","Gerencie suas informações e seu avatar."],teacher:["Área dos professores","Acompanhe orientações e colaborações."],admin:["Administração","Gestão e moderação da plataforma."]}[state.page]}
function frame(html){const [title,subtitle]=titleData();document.getElementById("pageTitle").textContent=title;document.getElementById("pageSubtitle").textContent=subtitle;document.getElementById("pageContent").innerHTML=html;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function dashboard(){const ps=dataProjects(),ns=dataNews();frame(`<div class="stats"><article class="stat"><small>Meus projetos</small><b>${state.projects.length}</b></article><article class="stat"><small>Em acompanhamento</small><b>0</b></article><article class="stat"><small>Convites</small><b>0</b></article><article class="stat"><small>Progresso médio</small><b>${ps.length?Math.round(ps.reduce((a,p)=>a+Number(p.progresso||0),0)/ps.length):0}%</b></article></div><div class="dash-grid"><section class="card wide"><div class="card-head"><h2>Em destaque</h2></div><div class="carousel"><div class="carousel-track">${ns.map(n=>`<div class="slide"><div class="slide-image"></div><div class="slide-content"><small>${esc(n.categoria)}</small><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo)}</p><button class="btn btn-primary" data-news="${esc(n.id)}">Abrir notícia</button></div></div>`).join("")}</div></div></section><section class="card wide"><div class="card-head"><h2>Notícias recentes</h2><button class="btn btn-ghost" data-page="news">Ver todas</button></div><div class="horizontal">${ns.map(newsCard).join("")}</div></section><section class="card"><div class="card-head"><h2>Meus projetos</h2><button class="btn btn-primary" data-action="new-project">Novo projeto</button></div><div class="project-grid">${ps.slice(0,4).map(projectCard).join("")}</div></section></div>`)}function projectsPage(){frame(`<section class="card"><div class="card-head"><h2>Projetos</h2><button class="btn btn-primary" data-action="new-project">Novo projeto</button></div><div class="project-grid">${dataProjects().map(projectCard).join("")}</div></section>`)}function newsPage(){frame(`<section class="card"><h2>Notícias</h2><div class="horizontal">${dataNews().map(newsCard).join("")}</div></section>`)}
function profilePage(){const p=state.profile||{};frame(`<section class="card"><div class="profile-head">${avatar(p,true)}<div><h2>${esc(p.nome||"Usuário")}</h2><p class="muted">${esc(p.username||"usuário")} · ${esc(p.curso||"Sem curso")}</p></div><button class="btn btn-secondary" style="margin-left:auto" data-edit-profile>Editar perfil</button></div></section>`)}function simplePage(){frame(`<section class="card"><h2>${titleData()[0]}</h2><div class="empty">Esta área está pronta para receber os dados do Supabase.</div></section>`)}function goPage(page){state.page=page;({dashboard,projects:projectsPage,news:newsPage,profile:profilePage,favorites:simplePage,voting:simplePage,suggestions:simplePage,teacher:simplePage,admin:simplePage}[page]||dashboard)()}
function renderApp(){const p=state.profile||{};app.innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar">${brand()}<nav class="nav"><button data-page="dashboard">Visão geral</button><button data-page="projects">Projetos</button><button data-page="news">Notícias</button><button data-page="favorites">Favoritos</button><button data-page="voting">Destaque do mês</button><button data-page="suggestions">Sugestões</button><button data-page="profile">Meu perfil</button><button data-page="teacher">Área dos professores</button><button data-page="admin">Administração</button></nav><div class="sidebar-bottom"><div class="mini-profile">${avatar(p)}<div><strong>${esc(p.nome||state.user?.email||"Usuário")}</strong><small>${esc(p.username||"usuário")}</small></div></div><button class="logout" data-action="logout">Sair da conta</button></div></aside><main class="main"><header class="topbar"><div><button class="icon-btn menu" data-action="toggle-menu">☰</button><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div><div class="top-actions"><button class="icon-btn" data-action="notifications">♢</button></div></header><section id="pageContent"></section></main></div>`;goPage(state.page)}
function openModal(title,body){modalRoot.innerHTML=`<div class="modal-bg" data-close-modal><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" data-close-modal>×</button></div>${body}</div></div>`}function closeModal(){modalRoot.innerHTML=""}
function profileEditModal(){const p=state.profile||{};openModal("Editar meu perfil",`<form id="profile-edit-form" enctype="multipart/form-data"><div class="profile-avatar-edit">${avatar(p,true)}<div><label class="btn btn-secondary" for="profile-photo">Escolher foto</label><input id="profile-photo" class="hidden" type="file" accept="image/*"><div class="profile-actions" style="margin-top:8px"><button type="button" class="btn btn-ghost" data-remove-photo>Remover foto</button></div><small class="muted">JPG, PNG ou WebP.</small></div></div><div class="profile-grid"><div class="field span-2"><label>Nome</label><input class="input" name="nome" value="${esc(p.nome||"")}" required></div><div class="field"><label>Username</label><input class="input" name="username" value="${esc(p.username||"")}" pattern="[a-z0-9_]{3,30}" required></div><div class="field"><label>Curso</label><input class="input" name="curso" value="${esc(p.curso||"")}"></div><div class="field"><label>Turma</label><input class="input" name="turma" value="${esc(p.turma||"")}"></div><div class="field"><label>Instituição</label><input class="input" name="instituicao" value="${esc(p.instituicao||"")}"></div><div class="field span-2"><label>Biografia</label><textarea class="textarea" name="biografia">${esc(p.biografia||"")}</textarea></div></div><p id="profile-edit-message" class="message"></p><div class="profile-form-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancelar</button><button type="submit" class="btn btn-primary">Salvar alterações</button></div></form>`);document.getElementById("profile-photo")?.addEventListener("change",e=>{const file=e.target.files?.[0];if(file){const img=document.querySelector("#profile-edit-form .avatar img");if(img)img.src=URL.createObjectURL(file)}})}
function registerModal(){openModal("Criar conta",`<form id="account-form" novalidate><div class="form-grid"><div class="field span-2"><label>Nome completo</label><input class="input" name="nome" autocomplete="name" required></div><div class="field span-2"><label>Username</label><input class="input" name="username" autocomplete="username" pattern="[a-z0-9_]{3,30}" required></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" autocomplete="new-password" minlength="6" required></div><div class="field span-2"><label>Tipo de conta</label><div class="role-grid"><button type="button" class="role selected" data-role="aluno"><strong>Aluno</strong></button><button type="button" class="role" data-role="professor"><strong>Professor</strong></button></div><input type="hidden" name="tipo" value="aluno"></div><div class="field span-2" id="courseField"><label>Curso</label><select class="select" name="curso"><option value="">Escolha seu curso</option><option>Marketing</option><option>Administração</option><option>Informática</option></select></div></div><p id="account-message" class="message"></p><button type="submit" class="btn btn-primary full">Criar conta</button></form>`);document.querySelectorAll("[data-role]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-role]").forEach(x=>x.classList.remove("selected"));button.classList.add("selected");document.querySelector('[name="tipo"]').value=button.dataset.role;document.getElementById("courseField").classList.toggle("hidden",button.dataset.role!=="aluno")})}
function googleProfileModal(){openModal("Complete seu cadastro",`<form id="google-profile-form"><div class="field"><label>Nome</label><input class="input" name="nome" value="${esc(state.user?.user_metadata?.full_name||state.user?.user_metadata?.name||"")}" required></div><div class="field"><label>Username</label><input class="input" name="username" required></div><div class="field"><label>Curso</label><select class="select" name="curso" required><option value="">Escolha seu curso</option><option>Marketing</option><option>Administração</option><option>Informática</option></select></div><p id="google-profile-message" class="message"></p><button class="btn btn-primary full">Salvar perfil e entrar</button></form>`)}function openForgot(){openModal("Recuperar acesso",`<form id="forgot-form"><label>E-mail</label><input class="input" id="forgot-email" type="email" required><p id="forgot-message" class="message"></p><button class="btn btn-primary full">Enviar instruções</button></form>`)}
async function resolveUsername(v){const x=String(v||"").trim().toLowerCase();if(x.includes("@"))return x;const r=await supabaseClient.rpc("resolve_username",{username_input:x});if(r.error)throw r.error;return r.data?.[0]?.email||null}async function loadProfile(user){const r=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();if(r.error)throw r.error;state.profile=r.data||null}async function loadData(){if(!state.user)return;const [p,n,f]=await Promise.all([supabaseClient.from("projects").select("*").order("created_at",{ascending:false}),supabaseClient.from("news").select("*").eq("status","publicado"),supabaseClient.from("favorites").select("*").eq("user_id",state.user.id)]);if(!p.error)state.projects=p.data||[];if(!n.error)state.news=n.data||[];if(!f.error)state.favorites=f.data||[]}async function finishSession(session){state.session=session;state.user=session?.user||null;if(!state.user){state.profile=null;renderLogin();return}await loadProfile(state.user);if(!state.profile){if(state.user.identities?.some(x=>x.provider==="google")){googleProfileModal();return}showToast("Perfil não encontrado.");return}await loadData();renderApp()}
async function login(e){e.preventDefault();const f=e.target,m=document.getElementById("login-message");try{const email=await resolveUsername(f.elements.identifier.value);if(!email){m.textContent="Usuário não encontrado.";return}const r=await supabaseClient.auth.signInWithPassword({email,password:f.elements.password.value});if(r.error)throw r.error;await finishSession(r.data.session)}catch(x){m.textContent=authError(x)}}async function register(e){e.preventDefault();const f=e.target,m=document.getElementById("account-message");try{const r=await supabaseClient.auth.signUp({email:f.elements.email.value,password:f.elements.password.value,options:{emailRedirectTo:APP_URL,data:{nome:f.elements.nome.value,username:f.elements.username.value.toLowerCase(),tipo_solicitado:f.elements.tipo.value,curso:f.elements.curso.value||null}}});if(r.error)throw r.error;m.className="message ok";m.textContent=r.data.session?"Cadastro realizado.":"Cadastro criado. Confirme o e-mail."}catch(x){m.textContent=authError(x)}}async function saveGoogle(e){e.preventDefault();const f=e.target,m=document.getElementById("google-profile-message");try{const r=await supabaseClient.from("profiles").update({nome:f.elements.nome.value,username:f.elements.username.value.toLowerCase(),curso:f.elements.curso.value}).eq("id",state.user.id);if(r.error)throw r.error;closeModal();await finishSession(state.session)}catch(x){m.textContent=authError(x)}}async function oauth(provider){const r=await supabaseClient.auth.signInWithOAuth({provider,options:{redirectTo:APP_URL}});if(r.error)showToast(authError(r.error))}async function forgot(e){e.preventDefault();const r=await supabaseClient.auth.resetPasswordForEmail(document.getElementById("forgot-email").value,{redirectTo:APP_URL});if(r.error)document.getElementById("forgot-message").textContent=authError(r.error);else{closeModal();showToast("Confira seu e-mail.")}}
async function uploadAvatar(file){if(!file)return state.profile?.foto_url||null;const path=`${state.user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const upload=await supabaseClient.storage.from("avatars").upload(path,file,{upsert:true});if(upload.error)throw upload.error;return supabaseClient.storage.from("avatars").getPublicUrl(path).data.publicUrl}
async function saveProfile(e){e.preventDefault();const f=e.target,m=document.getElementById("profile-edit-message"),button=f.querySelector('button[type="submit"]');const username=f.elements.username.value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(username)){m.textContent="Username inválido.";return}button.disabled=true;try{const foto=await uploadAvatar(document.getElementById("profile-photo")?.files?.[0]);const r=await supabaseClient.from("profiles").update({nome:f.elements.nome.value.trim(),username,curso:f.elements.curso.value.trim()||null,turma:f.elements.turma.value.trim()||null,instituicao:f.elements.instituicao.value.trim()||null,biografia:f.elements.biografia.value.trim()||null,foto_url:foto}).eq("id",state.user.id);if(r.error)throw r.error;await loadProfile(state.user);closeModal();profilePage();showToast("Perfil atualizado com sucesso.")}catch(x){m.textContent=authError(x)}finally{button.disabled=false}}
document.addEventListener("submit",e=>{if(e.target.id==="login-form")login(e);if(e.target.id==="account-form")register(e);if(e.target.id==="google-profile-form")saveGoogle(e);if(e.target.id==="forgot-form")forgot(e);if(e.target.id==="profile-edit-form")saveProfile(e)});document.addEventListener("click",e=>{const p=e.target.closest("[data-page]"),a=e.target.closest("[data-action]"),o=e.target.closest("[data-oauth]"),t=e.target.closest("[data-toggle-password]");if(p){e.preventDefault();goPage(p.dataset.page)}if(e.target.closest("[data-edit-profile]"))profileEditModal();if(o)oauth(o.dataset.oauth);if(t){const i=document.getElementById(t.dataset.togglePassword);if(i)i.type=i.type==="password"?"text":"password"}if(a){const n=a.dataset.action;if(n==="create-account")registerModal();if(n==="forgot-password")openForgot();if(n==="toggle-menu")document.getElementById("sidebar")?.classList.toggle("open");if(n==="logout")supabaseClient.auth.signOut();if(n==="notifications")showToast("Você não tem novas notificações.")}});modalRoot.addEventListener("click",e=>{if(e.target.hasAttribute("data-close-modal"))closeModal()});supabaseClient.auth.onAuthStateChange((_e,s)=>{if(s?.user?.id!==state.user?.id||!s)finishSession(s)});(async()=>{const r=await supabaseClient.auth.getSession();await finishSession(r.data?.session||null)})();
</script>
</body>
</html>
